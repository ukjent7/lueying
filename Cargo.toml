[workspace]
resolver = "3"
members = [
    # 核心:平台无关的词典、引擎、模型与协议
    "crates/dict",
    "crates/engine",
    "crates/cli",
    "crates/ext",
    "crates/extmeta",
    "crates/features",
    "crates/lm",
    "crates/ocr",
    "crates/rerank",
    "crates/protocol",
    # 运行期扩展:场景协议 + QuickJS 宿主,平台无关
    "crates/extjs",
    # 运行期扩展:旁路进程层,按需启动、JSON 行协议,平台无关
    "crates/bypass",
    # 扩展服务缝:提供者契约与完成队列,平台无关
    "crates/extsvc",
    # 联网边界:更新与下载,常驻 Server 不依赖
    "crates/net",
    # 渲染核心:候选窗 Skia 出帧,平台无关
    "crates/render",
    # Windows 宿主与安装
    "crates/server",
    "crates/tsf",
    "crates/installer",
    # 验证与工具
    "crates/e2e",
    "crates/win-e2e",
    "crates/install-e2e",
    "xtask",
]

# Wasm 原型独立成 workspace,不进默认构建;需要测量时按 crate 内说明手动跑。
exclude = ["crates/extwasm"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-cli = { path = "crates/cli" }
lueying-dict = { path = "crates/dict" }
lueying-engine = { path = "crates/engine" }
lueying-ext = { path = "crates/ext" }
lueying-extjs = { path = "crates/extjs" }
lueying-extmeta = { path = "crates/extmeta" }
lueying-extsvc = { path = "crates/extsvc" }
lueying-bypass = { path = "crates/bypass" }
lueying-net = { path = "crates/net" }
lueying-features = { path = "crates/features" }
lueying-ocr = { path = "crates/ocr" }
lueying-protocol = { path = "crates/protocol" }
lueying-render = { path = "crates/render" }
lueying-rerank = { path = "crates/rerank" }
lueying-server = { path = "crates/server" }
# 候选窗 Skia 渲染:默认光栅(E2E/无头),Windows 叠加 d3d。
# 特性集必须与 rust-skia 发布的预编译二进制键逐字对上,对不上就静默退化成本地
# 编 Skia(CI 上十几分钟起,Linux 还会因为缺 freetype 头文件直接失败):
#   Linux : jpegd-jpege-pdf-textlayout
#   Windows: d3d-ganesh-jpegd-jpege-pdf-textlayout
# jpeg/pdf 不是功能需求,是命中预编译键的必要条件;Windows 侧还必须留
# textlayout,因为只有带它的预编译包才带 icudtl.dat(embed-icudtl 要用)。
skia-safe = { version = "0.156", default-features = false, features = [
    "binary-cache",
    "embed-icudtl",
    "jpeg",
    "pdf",
    "textlayout",
] }

[profile.release]
lto = "thin"
# 发布产物链接期去掉符号表,CI 体积门禁与发布目录量到的就是用户拿到的文件。
strip = "symbols"
# 不开 panic = "abort":TSF DLL 的 catch_unwind 是宿主崩溃前最后一道边界,
# Server/Settings 的 unwind 也用于线程级兜底;strip 后的体积收益很小。
