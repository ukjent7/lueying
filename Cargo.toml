[workspace]
resolver = "3"
members = [
    "crates/dict",
    "crates/engine",
    "crates/e2e",
    "crates/install-e2e",
    "crates/installer",
    "crates/lm",
    "crates/protocol",
    "crates/rerank",
    "crates/server",
    "crates/tsf",
    "crates/win-e2e",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-dict = { path = "crates/dict" }
lueying-engine = { path = "crates/engine" }
lueying-rerank = { path = "crates/rerank" }

[profile.release]
lto = "thin"
