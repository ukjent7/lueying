[workspace]
resolver = "3"
members = [
    "crates/dict",
    "crates/engine",
    "crates/e2e",
    "crates/protocol",
    "crates/server",
    "crates/tsf",
    "crates/win-e2e",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
pinyin-dict = { path = "crates/dict" }
pinyin-engine = { path = "crates/engine" }

[profile.release]
lto = "thin"
