[workspace]
resolver = "3"
members = [
    # 核心:平台无关的词典、输入内核(解码、学习、功能、会话)、重排模型与协议
    "crates/dict",
    "crates/core",
    "crates/cli",
    "crates/ext",
    "crates/rerank",
    "crates/protocol",
    # 渲染核心:候选窗与面板的绘制指令,平台无关
    "crates/render",
    # Windows 平台薄层:TSF 宿主、常驻服务与安装(E2E 见 platforms/windows/*)
    "platforms/windows/server",
    # 设置窗独立进程:Slint 设置页、扩展商店、更新与备份;与扩展宿主一样可联网的界面进程
    "platforms/windows/settings",
    # 扩展宿主进程:运行全部扩展(Wasm 与原生),允许联网;服务端经 stdio 行协议驱动
    "platforms/windows/ext-host",
    "platforms/windows/tsf",
    "platforms/windows/installer",
    # 验证与工具
    "crates/bench",
    "platforms/windows/win-e2e",
    # 官方扩展:编成 wasm32-unknown-unknown 后随包分发。
    "extensions/shot-ocr",
    "extensions/clipboard-history",
    "extensions/voice-asr",
    "extensions/ppocr",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-cli = { path = "crates/cli" }
lueying-dict = { path = "crates/dict" }
lueying-core = { path = "crates/core" }
lueying-ext = { path = "crates/ext" }
lueying-ext-host = { path = "platforms/windows/ext-host" }
lueying-protocol = { path = "crates/protocol" }
lueying-render = { path = "crates/render" }
lueying-rerank = { path = "crates/rerank" }
lueying-server = { path = "platforms/windows/server" }
lueying-settings = { path = "platforms/windows/settings" }
# 出站 HTTPS:设置窗(更新、扩展安装)与扩展宿主共用;证书走系统证书库,HTTPS 不降级。
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "gzip",
    "socks-proxy",
] }
# 组件模型宿主:扩展以标准 Wasm 组件(WASI 0.3)运行。
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "wat",
    "component-model",
] }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
slint-build = "1.18.1"

[profile.release]
lto = "thin"
# 发布产物链接期去掉符号表,CI 体积门禁与发布目录量到的就是用户拿到的文件。
strip = "symbols"
# 不开 panic = "abort":TSF DLL 的 catch_unwind 是宿主崩溃前最后一道边界,
# Server/Settings 的 unwind 也用于线程级兜底;strip 后的体积收益很小。
