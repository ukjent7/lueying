[workspace]
resolver = "3"
members = [
    # 核心:平台无关的词典、引擎、模型与协议
    "crates/dict",
    "crates/engine",
    "crates/ext",
    "crates/features",
    "crates/lm",
    "crates/rerank",
    "crates/protocol",
    # 渲染核心:候选窗 Skia 出帧,平台无关
    "crates/render",
    # Windows 宿主与安装
    "crates/server",
    "crates/tsf",
    "crates/installer",
    # 验证与工具
    "crates/e2e",
    "crates/win-e2e",
    "crates/install-e2e",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-dict = { path = "crates/dict" }
lueying-engine = { path = "crates/engine" }
lueying-ext = { path = "crates/ext" }
lueying-features = { path = "crates/features" }
lueying-render = { path = "crates/render" }
lueying-rerank = { path = "crates/rerank" }
# 候选窗 Skia 渲染:默认光栅(E2E/无头),Windows 叠加 d3d。
skia-safe = { version = "0.156", default-features = false, features = [
    "binary-cache",
    "embed-icudtl",
    "textlayout",
] }

[profile.release]
lto = "thin"
