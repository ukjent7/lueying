[workspace]
resolver = "3"
members = [
    # 核心:平台无关的词典、引擎、模型与协议
    "crates/dict",
    "crates/engine",
    "crates/ext",
    "crates/features",
    "crates/lm",
    "crates/rerank",
    "crates/protocol",
    # Windows 宿主与安装
    "crates/server",
    "crates/tsf",
    "crates/installer",
    # 验证与工具
    "crates/e2e",
    "crates/win-e2e",
    "crates/install-e2e",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-dict = { path = "crates/dict" }
lueying-engine = { path = "crates/engine" }
lueying-ext = { path = "crates/ext" }
lueying-features = { path = "crates/features" }
lueying-rerank = { path = "crates/rerank" }

[profile.release]
lto = "thin"
