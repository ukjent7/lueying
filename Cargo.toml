[workspace]
resolver = "3"
members = [
    # 核心:平台无关的词典、引擎、模型与协议
    "crates/dict",
    "crates/engine",
    "crates/cli",
    "crates/ext",
    "crates/extguest",
    "crates/extmeta",
    "crates/extproto",
    "crates/features",
    "crates/lm",
    "crates/rerank",
    "crates/protocol",
    # 运行期扩展:Extism 插件宿主与每扩展 worker,平台无关
    "crates/extwasm",
    # 扩展服务缝:提供者契约与完成队列,平台无关
    "crates/extsvc",
    # 输入会话内核:候选视图同步与重排决策,Windows 与 macOS 共用
    "crates/session",
    # 联网边界:更新与下载,常驻 Server 不依赖
    "crates/net",
    # 联网 broker:扩展网络请求的唯一出口,独立进程,平台无关协议层
    "crates/broker",
    # 渲染核心:候选窗与面板的绘制指令,平台无关
    "crates/render",
    # Windows 平台薄层:TSF 宿主、常驻服务与安装(E2E 见 platforms/windows/*)
    "platforms/windows/server",
    "platforms/windows/tsf",
    "platforms/windows/installer",
    # macOS 平台薄层:InputMethodKit 外壳与候选窗画布(仅 macOS 目标编译)
    "platforms/macos/ime",
    # Linux 平台薄层:Wayland 输入法协议外壳与软件渲染候选窗(仅 Linux 目标编译)
    "platforms/linux/ime",
    # 验证与工具
    "crates/e2e",
    "platforms/windows/win-e2e",
    "platforms/windows/install-e2e",
    # 官方扩展:编成 wasm32-unknown-unknown 后随包分发。
    "extensions/shot-ocr",
    "extensions/input-schemes",
    "extensions/clipboard-history",
    "extensions/voice-asr",
    "extensions/ppocr",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lueying-cli = { path = "crates/cli" }
lueying-dict = { path = "crates/dict" }
lueying-engine = { path = "crates/engine" }
lueying-ext = { path = "crates/ext" }
lueying-extguest = { path = "crates/extguest" }
lueying-extmeta = { path = "crates/extmeta" }
lueying-extproto = { path = "crates/extproto" }
lueying-extsvc = { path = "crates/extsvc" }
lueying-extwasm = { path = "crates/extwasm" }
lueying-broker = { path = "crates/broker" }
lueying-net = { path = "crates/net" }
lueying-features = { path = "crates/features" }
lueying-input-schemes = { path = "extensions/input-schemes" }
lueying-protocol = { path = "crates/protocol" }
lueying-render = { path = "crates/render" }
lueying-rerank = { path = "crates/rerank" }
lueying-session = { path = "crates/session" }
lueying-server = { path = "platforms/windows/server" }
# Extism 运行期:插件格式、内核 ABI 与宿主函数都在这里。关掉默认特性,
# 联网与文件注册留给宿主自己接,插件碰不到网络与磁盘。
extism = { version = "1.41", default-features = false }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
slint-build = "1.18.1"

[profile.release]
lto = "thin"
# 发布产物链接期去掉符号表,CI 体积门禁与发布目录量到的就是用户拿到的文件。
strip = "symbols"
# 不开 panic = "abort":TSF DLL 的 catch_unwind 是宿主崩溃前最后一道边界,
# Server/Settings 的 unwind 也用于线程级兜底;strip 后的体积收益很小。
