# cargo-deny:漏洞(RustSec)一律红,依赖来源与重复版本一起管。许可证暂不做门禁:
# GPL 项目的依赖许可口径还没定,先靠审计日志可见,红不拦。
[advisories]
# yanked 是提示级信号,由每周审计人工复核,不拦红。
yanked = "warn"
# unmaintained 只对直接依赖可选作用域,现 schema 没有 warn 档,先整个关掉。
unmaintained = "none"

[sources]
# crates.io 是默认唯一允许的注册源,git 依赖一律拦。
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
