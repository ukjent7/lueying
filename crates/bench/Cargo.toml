[package]
name = "lueying-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "拼音引擎基准与端到端运行器,产出 Markdown 报告"

[[bin]]
name = "lueying-bench"
path = "src/main.rs"

[features]
default = ["product-e2e"]
product-e2e = ["dep:lueying-cli", "lueying-ext/host", "dep:lueying-ext-host"]

[dependencies]
lueying-cli = { workspace = true, optional = true }
lueying-dict.workspace = true
lueying-core = { workspace = true, features = ["sim-clock"] }
# The component runtime is only used by the product E2E scenarios.
lueying-ext.workspace = true
lueying-render.workspace = true
lueying-rerank.workspace = true
# 设置页模型在设置窗 crate 的平台无关部分,E2E 直接断言它的结构与交互。
lueying-server.workspace = true
lueying-settings.workspace = true
# 扩展宿主进程:本可执行文件以 --ext-host 运行时即宿主(E2E 自拉起)。
lueying-ext-host = { workspace = true, optional = true }
# 产品的候选快照与同步门控:基准直接走这条路径,不另写一份。
serde_json = "1.0.154"
