[package]
name = "lueying-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "候选窗 Skia 渲染核心:平台无关,吃数据出帧"

[dependencies]
skia-safe.workspace = true

# D3D 后端只在 Windows 参与构建;Linux/E2E 用光栅出帧。
[target.'cfg(windows)'.dependencies]
skia-safe = { workspace = true, features = ["d3d"] }
