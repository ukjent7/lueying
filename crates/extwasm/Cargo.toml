[package]
name = "lueying-extwasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "运行期 Wasm 扩展宿主:wasmi 2.x、每扩展 worker、阻塞服务调用"

[dependencies]
# 清单、权限与同意记录。
lueying-extmeta.workspace = true
# 场景协议与服务结果类型,与 guest SDK 共用。
lueying-extproto.workspace = true
# 服务缝:阻塞调用现有提供者。
lueying-extsvc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 纯 Rust 解释器,无 JIT/C++/可执行内存;wat 只用于自检与测试里的文本模块。
wasmi = { version = "2", default-features = false, features = [
    "std",
    "auto-dispatch",
    "validate",
    "wat",
] }
