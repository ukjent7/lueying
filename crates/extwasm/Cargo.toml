[package]
name = "lueying-extwasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "运行期扩展宿主:Extism 插件、每扩展 worker、阻塞服务调用"

[dependencies]
# 清单、权限与同意记录。
lueying-extmeta.workspace = true
# 场景协议与服务结果类型,与 guest SDK 共用。
lueying-extproto.workspace = true
# 服务缝:阻塞调用现有提供者。
lueying-extsvc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Extism 运行期:插件格式、内核 ABI 与宿主函数都在这里。默认特性关掉,
# 插件自己发不了 HTTP、也读不了宿主文件;联网只走宿主的服务提供者。
extism.workspace = true
# wasmtime 只用来配 wasm 栈上限;版本跟 extism 依赖的 wasmtime 一致,
# 升级 extism 时一起升,免得树里出现两份 wasmtime。
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "wat",
] }

[target."cfg(windows)".dependencies]
# 原生扩展进程的 Job Object 限额与 AppContainer 沙箱。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
