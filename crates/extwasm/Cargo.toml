[package]
name = "lueying-extwasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "运行期扩展宿主:Wasm 组件、每扩展 worker、阻塞服务调用"

[dependencies]
# 清单、权限与同意记录。
lueying-extmeta.workspace = true
# 场景协议与服务结果类型,与 guest SDK 共用。
lueying-extproto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasmtime:组件模型宿主与 wasm 栈上限。
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "wat",
    "component-model",
] }
# WASI 0.2:非 Rust 工具链(componentize-py、带 stdio 的 JS 等)编出的
# 组件会导入 WASI 接口。能力按最紧配置给:无文件、无网络、无环境变量,
# 只有时钟与随机;联网仍然只能走宿主的 network 服务。
wasmtime-wasi = "49"

[target."cfg(windows)".dependencies]
# 原生扩展进程的 Job Object 限额与 AppContainer 沙箱。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
