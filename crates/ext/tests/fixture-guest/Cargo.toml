[package]
name = "fixture-guest"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "扩展宿主行为测试客人:回显、报错、trap、空转、内存暴涨、通知"
publish = false

# 独立 crate:只随 CI 以 wasm32 目标构建,不在工作区里。
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# 变体 B:回显加 [b] 前缀、主题色不同;热重载与合并顺序测试用。
variant-b = []

[dependencies]
lueying-ext = { path = "../..", default-features = false, features = ["guest"] }
serde_json = "1"
wit-bindgen = "0.63"

# 服务外观是按需生成的死代码时也要被裁掉,宿主只该看到用到的服务导入。
[profile.release]
lto = true
codegen-units = 1
