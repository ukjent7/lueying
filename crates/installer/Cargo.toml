[package]
name = "lueying-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "安装/卸载掠影拼音输入法:复制 x64/x86 文件、注册 TSF、写入自启动"

[[bin]]
name = "lueying-install"
path = "src/main.rs"

[dependencies]
lueying-protocol = { path = "../protocol" }
serde_json = "1"

[target."cfg(windows)".dependencies]
windows-registry = "0.100"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
