[package]
name = "lueying-rerank"
version = "0.1.0"
edition.workspace = true
# 本 crate 的 lm 子模块是 Apache-2.0 的上游代码副本,其余为 GPL-3.0-or-later。
license = "GPL-3.0-or-later AND Apache-2.0"
description = "本地神经重排:8M 同步、25M 停顿门控与去抖;内含 Apache-2.0 的字符级语言模型推理内核"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
# 唯一的例外是 `lm/math.rs` 按 CPU 分派内核的那次调用。
unsafe_code = "deny"
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
