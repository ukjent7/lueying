# 小团子:站在高亮候选上的精灵;上屏时跳一段庆祝舞。
# 素材是 64×64 的横向图集,帧序号从 0 起。

[[nodes]]
id = "mochi"
kind = "sprite"
src = "mochi@2x.png"
grid = [64, 64]
fps = 8
frames = "idle"
anchor = "highlight.top"
follow = { spring = 6.0 }

[nodes.clips.cheer]
frames = [0, 1, 2, 3, 2, 1, 0]
fps = 10
loop = false

[[rules]]
on = "commit"
when = "candidates > 0"
do = [
  { play = "mochi.cheer" },
  { tween = "mochi.offset.y", to = -6.0, over = "80ms", ease = "out_quad" },
  { delay = "160ms", then = [
    { tween = "mochi.offset.y", to = 0.0, over = "120ms", ease = "out_back" },
  ] },
]
