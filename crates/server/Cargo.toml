[package]
name = "pinyin-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "常驻服务进程:命名管道服务各 TSF 会话,持有词典与引擎"

[[bin]]
name = "pinyin-server"
path = "src/main.rs"

[dependencies]
pinyin-dict.workspace = true
pinyin-engine.workspace = true
pinyin-protocol = { path = "../protocol" }
serde_json = "1"

[target."cfg(windows)".dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
