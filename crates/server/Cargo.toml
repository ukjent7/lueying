[package]
name = "lueying-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "常驻服务进程:命名管道服务各 TSF 会话,持有词典与引擎"

[[bin]]
name = "lueying-server"
path = "src/main.rs"

[[bin]]
name = "lueying-settings"
path = "src/settings_main.rs"

[dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
# 停顿重排缝:旁路提供者按需拉起子进程。
lueying-bypass.workspace = true
# 扩展运行指标快照:设置页与 `lueying ext top` 读同一份格式。
lueying-extmeta.workspace = true
# 联网边界:设置窗的更新检查与官方扩展下载走这里,常驻 Server 不引用。
lueying-net.workspace = true
lueying-features.workspace = true
lueying-rerank.workspace = true
# 渲染核心:设置页的控件层在平台无关的部分,Windows 与 Linux E2E 共用。
lueying-render.workspace = true
lueying-protocol = { path = "../protocol" }
# 配置 schema:typed TOML,未知键在读取时拒绝。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# 用户词库落盘:SQLite(WAL)。
rusqlite = { version = "0.41", features = ["bundled"] }
# 令牌生成的 CSPRNG,直连系统随机源。
getrandom = "0.4"

[target."cfg(windows)".dependencies]
# 设置窗无障碍:AccessKit 把页面模型暴露成 UIA 树,读屏软件才能操作自绘控件。
accesskit = "0.25"
accesskit_windows = "0.35"
# Skia 只剩设置窗/徽标/命令面板的 CPU 光栅(blit 与 lueying-render)。
skia-safe.workspace = true
# D2D 变换矩阵与浮点向量;windows 绑定按裸类型引用,要直连依赖。
windows-numerics = "0.3.1"
# 可选 OCR 引擎:PP-OCRv6 det+rec,纯 Rust 推理。
lueying-ocr.workspace = true
# 运行期 Wasm 扩展:wasmi 沙箱与每扩展 worker,只改候选窗外观或执行命令。
lueying-extwasm.workspace = true
# Slint 只服务设置窗(候选窗走自绘 D2D);Linux E2E 不背这棵树。
slint.workspace = true
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
slint-build.workspace = true
