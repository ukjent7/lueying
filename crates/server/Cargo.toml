[package]
name = "pinyin-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "常驻服务进程:命名管道服务各 TSF 会话,持有词典与引擎"

[[bin]]
name = "pinyin-server"
path = "src/main.rs"

[dependencies]
pinyin-dict.workspace = true
pinyin-engine.workspace = true
pinyin-rerank.workspace = true
pinyin-protocol = { path = "../protocol" }
serde_json = "1"

[target."cfg(windows)".dependencies]
# 官方推荐:git 依赖跟随 zed 仓库 main(无独立版本号)
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
raw-window-handle = "0.6"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
