[package]
name = "lueying-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "常驻服务进程:命名管道服务各 TSF 会话,持有词典与引擎"

[[bin]]
name = "lueying-server"
path = "src/main.rs"

[[bin]]
name = "lueying-settings"
path = "src/settings_main.rs"

[dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
# 停顿重排缝:旁路提供者按需拉起子进程。
lueying-bypass.workspace = true
# 扩展运行指标快照:设置页与 `lueying ext top` 读同一份格式。
lueying-extmeta.workspace = true
# 联网边界:设置窗的更新检查与官方扩展下载走这里,常驻 Server 不引用。
lueying-net.workspace = true
lueying-features.workspace = true
lueying-rerank.workspace = true
# 渲染核心:设置页的控件层在平台无关的部分,Windows 与 Linux E2E 共用。
lueying-render.workspace = true
lueying-protocol = { path = "../protocol" }
# 配置 schema:typed TOML,未知键在读取时拒绝。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# 令牌生成的 CSPRNG。
rand_core = { version = "0.6", features = ["getrandom"] }

[target."cfg(windows)".dependencies]
# 设置窗无障碍:AccessKit 把页面模型暴露成 UIA 树,读屏软件才能操作自绘控件。
accesskit = "0.25"
accesskit_windows = "0.35"
# Skia 候选窗:渲染核心 + Ganesh-D3D12 后端。
skia-safe = { workspace = true, features = ["d3d"] }
# 可选 OCR 引擎:PP-OCRv6 det+rec,纯 Rust 推理。
lueying-ocr.workspace = true
# 运行期脚本扩展:QuickJS 沙箱,只改候选窗外观。
lueying-extjs.workspace = true
windows-registry = "0.100"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    # V3 帧级基准读进程工作集。
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
