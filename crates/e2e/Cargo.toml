[package]
name = "lueying-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "拼音引擎 E2E 运行器,产出 Markdown 报告"

[[bin]]
name = "lueying-e2e"
path = "src/main.rs"

[dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
lueying-extjs.workspace = true
lueying-features.workspace = true
lueying-render.workspace = true
lueying-rerank.workspace = true
# 设置页模型在服务端 crate 的平台无关部分,E2E 直接断言它的结构与交互。
lueying-server.workspace = true
skia-safe.workspace = true
serde_json = "1"
