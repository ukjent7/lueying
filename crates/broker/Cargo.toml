[package]
name = "lueying-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "联网 broker:扩展网络请求的唯一出口,独立进程,常驻服务不链接网络栈"

[[bin]]
name = "lueying-broker"
path = "src/main.rs"

[dependencies]
lueying-extproto.workspace = true
serde_json = "1"

# 受限传输(HTTPS-only 外部地址,回环允许明文)只有 Windows 实现。
[target."cfg(windows)".dependencies]
lueying-net.workspace = true
