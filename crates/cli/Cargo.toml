[package]
name = "lueying-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "掠影命令行:扩展开发回路与运行指标"

[[bin]]
name = "lueying"
path = "src/main.rs"

[lib]
name = "lueying_cli"
path = "src/lib.rs"

[dependencies]
lueying-dict.workspace = true
lueying-core.workspace = true
lueying-ext.workspace = true
lueying-protocol = { path = "../protocol" }
serde_json = "1"
toml = "1.1"
# ext add 的 GitHub 拉取:Release 资产与源码包。
ureq = "3"
flate2 = "1"
tar = "0.4"
