[package]
name = "lueying-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "掠影命令行:扩展开发回路与运行指标"

[[bin]]
name = "lueying"
path = "src/main.rs"

[lib]
name = "lueying_cli"
path = "src/lib.rs"

[dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
lueying-extmeta.workspace = true
lueying-features.workspace = true
lueying-protocol = { path = "../protocol" }
serde_json = "1"
toml = "1.1"
