[package]
name = "lueying-lm"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "输入法重排用字符级语言模型;源自 metasequoiaime/chinese-ime-lm (Apache-2.0),树内维护"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
