[package]
name = "lueying-lm"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "输入法重排用字符级语言模型;源自 metasequoiaime/chinese-ime-lm (Apache-2.0),树内维护"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
# 唯一的例外是 `math.rs` 按 CPU 分派内核的那次调用。
unsafe_code = "deny"
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
