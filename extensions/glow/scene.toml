# 微光:打字越快,高亮块的光圈越大越亮。
# 场景皮肤扩展:`lueying ext pack` 打包安装,设置「扩展」页启用即生效;
# 改盘或换包一秒内热重载。

[signals.energy]
from = "typing_rate"
gain = 0.6
decay = "1.5s"

[[nodes]]
id = "glow"
kind = "shape"
shape = "rrect"
anchor = "highlight"
inset = -5
radius = 6
fill = "accent"
opacity = "lerp(0.15, 0.55, energy)"
effect = { kind = "blur", radius = "lerp(2, 10, energy)" }
