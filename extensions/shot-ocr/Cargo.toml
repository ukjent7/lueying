[package]
name = "shot-ocr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "掠影官方截图 OCR 扩展:Wasm 组件 guest"

[lib]
crate-type = ["cdylib"]

[dependencies]
lueying-ext = { workspace = true, default-features = false, features = ["guest"] }
serde_json = "1"

# 组件 ABI:export_component! 生成的绑定只在 wasm32 目标引用它。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"
