[package]
name = "clipboard-history"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "掠影官方剪贴板历史扩展:热键唤出胶囊面板"

[lib]
crate-type = ["cdylib"]

[dependencies]
lueying-ext = { workspace = true, default-features = false, features = ["guest"] }
serde_json = "1.0.154"

# 组件 ABI:export_component! 生成的绑定只在 wasm32 目标引用它。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63.0"
