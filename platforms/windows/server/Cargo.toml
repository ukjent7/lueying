[package]
name = "lueying-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "常驻服务进程:命名管道服务各 TSF 会话,持有词典与引擎"

[[bin]]
name = "lueying-server"
path = "src/main.rs"

[dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
lueying-features.workspace = true
lueying-rerank.workspace = true
# 渲染核心:候选窗/徽标/选择面板的布局与命中;设置窗 UI 已由 Slint 承担。
lueying-render.workspace = true
# 会话内核:候选视图同步与重排快照。
lueying-session.workspace = true
lueying-protocol = { path = "../../../crates/protocol" }
# 扩展清单与场景协议:设置页与指标快照共用,不带宿主运行时。
lueying-ext = { workspace = true, default-features = false }
# 配置 schema:typed TOML,未知键在读取时拒绝。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# 令牌生成的 CSPRNG,直连系统随机源。
getrandom = "0.4"

[target."cfg(windows)".dependencies]
# 常驻进程与设置窗的分配器:降碎片,服务端峰值工作集门禁受益;纯分配器,无网络符号。
mimalloc = "0.1.52"
# D2D 变换矩阵与浮点向量;windows 绑定按裸类型引用,要直连依赖。
windows-numerics = "0.3.1"
# 运行期 Wasm 扩展:组件沙箱与每扩展 worker,只改候选窗外观或执行命令。
lueying-ext = { workspace = true, default-features = false, features = ["host"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
