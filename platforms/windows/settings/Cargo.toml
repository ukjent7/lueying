[package]
name = "lueying-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "设置窗独立进程:Rune 设置页、扩展商店、更新与备份;可联网的界面进程"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lueying-settings"
path = "src/main.rs"

[dependencies]
lueying-server.workspace = true
lueying-dict.workspace = true
lueying-core.workspace = true
# 设置页的行布局与工具条缩放共用渲染核心的常量与夹取规则。
lueying-render.workspace = true
# 更新检查、安装包下载与扩展安装(`ext add`)的 HTTPS;常驻 Server 不引用。
ureq.workspace = true
# 更新清单的 Ed25519 验签;发布侧签名在 xtask,共用同一条实现。
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
# `ext add` 解包 GitHub 源码包。
flate2 = "1"
tar = "0.4"
lueying-protocol = { path = "../../../crates/protocol" }
# 扩展清单与场景协议:设置页与指标快照共用,不带宿主运行时。
lueying-ext = { workspace = true, default-features = false }
serde_json = "1"
toml = "1.2"
# 词表解码:UTF-8 / UTF-16 / GB18030 一份实现。
encoding_rs = "0.8"

[target."cfg(windows)".dependencies]
# 扩展宿主模块:同意记录的读写与设置页的扩展列表,只在 Windows 设置窗里用。
lueying-ext = { workspace = true, default-features = false, features = ["host"] }
# 本地已验证权重预打包成自包含 safetensors 的推理内核,与常驻 Server 同一个 crate。
lueying-rerank.workspace = true
# 设置窗界面层:Rune 普通窗口 + 控件库(与候选窗同一框架)。
rune.workspace = true
rune-kit = { git = "https://github.com/ukjent7/rune", rev = "6b986137e42633602e7ad45f18224bc47015fb2b", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
