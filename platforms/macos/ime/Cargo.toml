[package]
name = "lueying-macos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "macOS InputMethodKit 外壳:IMKServer 会话与候选窗"

[[bin]]
name = "lueying-macos"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
lueying-dict.workspace = true
lueying-engine.workspace = true
lueying-protocol.workspace = true
lueying-render.workspace = true
lueying-rerank.workspace = true
# 会话内核:候选视图同步与重排快照,与 Windows 宿主共用同一份。
lueying-session.workspace = true
objc2 = "0.6.5"
# 用户配置文件:只读引擎层的键,格式与 Windows 的 config.toml 相同。
toml = "1.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSRange",
    "NSString",
    "NSTimer",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSApplication",
    "NSAppearance",
    "NSAttributedString",
    "NSBezierPath",
    "NSColor",
    "NSEvent",
    "NSFont",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSAccessibility",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSShadow",
    "NSStringDrawing",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }
objc2-input-method-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "IMKInputController",
    "IMKServer",
    "objc2-app-kit",
] }
