version: 2
updates:
  # actions 全部钉了 commit,靠 Dependabot 每周提 PR 升级(与 workflow 里注释的 tag 对照审阅)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Cargo 依赖每周分组升级:一个 PR 一起出,噪声可控;跟进最新稳定版是仓库约定。
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-all:
        patterns:
          - "*"
    ignore:
      # windows 0.62 的配套版本仍停在 core 0.62 / numerics 0.3。
      # 0.100 是下一代独立发布,单方面直接依赖会让 #[implement] 宏展开错位。
      - dependency-name: windows-core
        update-types: ["version-update:semver-major"]
      - dependency-name: windows-numerics
        update-types: ["version-update:semver-major"]
