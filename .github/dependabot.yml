version: 2
updates:
  # actions 全部钉了 commit,靠 Dependabot 每周提 PR 升级(与 workflow 里注释的 tag 对照审阅)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Cargo 依赖每周分组升级:一个 PR 一起出,噪声可控;跟进最新稳定版是仓库约定。
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-all:
        patterns:
          - "*"
