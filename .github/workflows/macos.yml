# macOS 平台层单独验证:InputMethodKit 外壳与候选窗只在 macOS 编译,
# 不拖慢 push 主门禁;改动相关文件时自动跑,也可手动触发。
# 外壳直接依赖引擎、词典、重排与会话 crate,所以任何 crates 改动都要在 Mac 上编一遍。
name: macos

on:
  push:
    branches: [main]
    paths:
      - "platforms/macos/**"
      - "crates/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "platforms/macos/**"
      - "crates/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: macos
      - name: Clippy
        run: cargo clippy -p lueying-macos --all-targets --locked -- -D warnings
      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-nextest
      - name: 测试
        run: cargo nextest run -p lueying-macos -p lueying-render --locked
      - name: 打包
        run: bash platforms/macos/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: lueying-macos-app
          path: dist/Lueying.app
          if-no-files-found: error
