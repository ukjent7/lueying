name: lock

# 临时工作流:在 CI 上生成带 tract 依赖的 Cargo.lock,并编译 OCR crate。
# 本机不装 Rust 工具链;拿到 artifact 后提交 Cargo.lock,再删掉本文件。
on:
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: 生成锁文件并编译 OCR
        run: cargo test -p lueying-ocr --release
      - name: 上传 Cargo.lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: Cargo.lock
