# 词典与引擎的共享语料基准:编译一次,按档位 × 分片铺到多台 runner,合并成 summary.json。
# 每次运行同时跑父提交(HEAD^)的同一批用例,逐条配对做 McNemar 检验;父提交的逐条结果按引擎目录缓存,
# 通常只跑当前提交一次。父提交的二进制用的是当前的基准代码,只换引擎。机器读 artifact 里的逐条 TSV 与 summary.json;比较两次运行用 tools/bench_shared.py diff。
# tag 留空时测 fetch_dict.sh 钉住的词典(档位名 main),quality 这样调用。
name: dict-bench

on:
  workflow_dispatch:
    inputs:
      tag:
        description: lueying-dict Release 标签,留空用钉住的词典
        required: false
        default: ""
      tiers:
        description: 空格分隔的档位,对应资产 main-<档位>.pyd
        required: true
        default: main
      gram:
        description: 搭配表资产名
        required: false
        default: collocation.bin
      patch:
        description: 构建前对 query.rs 与 rerank 执行的 sed -E 脚本,扫常量用
        required: false
        default: ""
      diff:
        description: 构建前应用的补丁(git diff | xz | base64),改动不进 main 也能跑基准
        required: false
        default: ""
      test:
        description: 同时跑 V2 测试集,只在发版时勾
        type: boolean
        default: false
  # lueying-dict 的 pipeline 发布后直接调用,公开仓库之间不需要令牌。
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      tiers:
        type: string
        default: main
      gram:
        type: string
        default: collocation.bin
      patch:
        type: string
        default: ""
      diff:
        type: string
        default: ""
      test:
        type: boolean
        default: false
    secrets:
      EVAL_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tiers: ${{ steps.tiers.outputs.json }}
      base-sha: ${{ steps.keys.outputs.base-sha }}
      base-key: ${{ steps.keys.outputs.base-key }}
      head-key: ${{ steps.keys.outputs.head-key }}
      save: ${{ steps.keys.outputs.save }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          # 需要父提交:配对对照与引擎缓存键都从 HEAD^ 取。
          fetch-depth: 2
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 应用补丁
        if: inputs.diff != ''
        env:
          DIFF: ${{ inputs.diff }}
        run: printf %s "$DIFF" | base64 -d | xz -d | git apply
      - name: 调整引擎常量
        if: inputs.patch != ''
        env:
          PATCH: ${{ inputs.patch }}
        run: |
          sed -i -E "$PATCH" crates/core/src/query.rs crates/rerank/src/lib.rs
          git diff --stat --exit-code && exit 1 || git diff
      # 对照与缓存键按引擎相关的文件内容算:父提交与当前提交只差文档或 CI 时,键相同,对照直接取缓存。
      # 带补丁的手动运行对照未改动的提交本身,补丁结果不入缓存。
      - name: 确定对照提交与缓存键
        id: keys
        env:
          PATCHED: ${{ inputs.diff != '' || inputs.patch != '' }}
        run: |
          key() {
            git ls-tree -r "$1" -- crates/bench crates/core crates/dict crates/rerank dicts \
              tools/fetch_dict.sh tools/fetch_rerank.sh tools/bench_shared.py tools/bench_shard.sh \
              .github/workflows/dict-bench.yml Cargo.lock | sha256sum | cut -c1-16
          }
          if [ "$PATCHED" = true ] || ! git rev-parse -q --verify HEAD^ >/dev/null; then base=HEAD; else base=HEAD^; fi
          {
            echo "base-sha=$(git rev-parse "$base")"
            echo "base-key=bench-items-$(key "$base")"
            echo "head-key=bench-items-$(key HEAD)"
            echo "save=$([ "$PATCHED" = true ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
      - name: 展开档位
        id: tiers
        env:
          TIERS: ${{ inputs.tiers }}
        run: echo "json=$(jq -cn --arg t "$TIERS" '$t | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - name: 构建 E2E
        run: cargo build -p lueying-bench --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-bin
          path: target/release/lueying-bench
          retention-days: 1
      # 父提交的基准二进制:父提交的引擎配当前的基准代码,与当前提交用同一批用例,差别只在引擎。
      # 同一个构建目录(依赖已编好,只重编改动的 crate)。
      - name: 构建父提交的 E2E
        env:
          BASE: ${{ steps.keys.outputs.base-sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-src" "$BASE"
          rm -rf "$RUNNER_TEMP/base-src/crates/bench"
          cp -r crates/bench "$RUNNER_TEMP/base-src/crates/bench"
          (cd "$RUNNER_TEMP/base-src" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build -p lueying-bench --release --locked)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-base-bin
          path: target/release/lueying-bench
          retention-days: 1

  # 带补丁的基准同时跑静态检查、单元测试与场景 E2E,结果好再提交时不用再等一轮。
  check:
    if: inputs.diff != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 应用补丁
        env:
          DIFF: ${{ inputs.diff }}
        run: printf %s "$DIFF" | base64 -d | xz -d | git apply
      - name: Clippy
        run: cargo clippy -p lueying-core -p lueying-rerank -p lueying-bench --all-targets --locked -- -D warnings
      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-nextest
      - name: 单元测试
        run: cargo nextest run -p lueying-core -p lueying-rerank --locked
      - name: 下载词典与模型
        run: |
          bash tools/fetch_dict.sh data
          bash tools/fetch_rerank.sh data/rerank
      - name: 安装 wasm-tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-tools
      - name: 构建官方 guest
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          wasm-tools component new target/wasm32-unknown-unknown/release/shot_ocr.wasm -o extensions/shot-ocr/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/clipboard_history.wasm -o extensions/clipboard-history/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/voice_asr.wasm -o extensions/voice-asr/extension.wasm
      # 组件测试客人:场景 E2E 的扩展行为检查由它驱动。
      - name: 组件测试客人构建
        run: |
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-a.wasm
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown --features variant-b
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-b.wasm
          echo "LUEYING_FIXTURE_WASM=$PWD/target/fixture-a.wasm" >> "$GITHUB_ENV"
          echo "LUEYING_FIXTURE_B_WASM=$PWD/target/fixture-b.wasm" >> "$GITHUB_ENV"
      - name: 场景 E2E
        run: cargo run -p lueying-bench --release --locked -- --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank --bench-fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-report
          path: |
            target/e2e-report.md
            target/bench-report.md
            target/e2e-failures.txt

  run:
    needs: build
    runs-on: ubuntu-latest
    # 语料增多后单片常超过 60 分钟(曾整片超时被取消),留足余量。
    # 8 片并行:语料约 1.4 万条,4 片时单片近 60 分钟。配对对照只在缓存未命中时多跑一遍。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.build.outputs.tiers) }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-base-bin
          path: base-bin
      - name: 缓存重排模型
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/rerank
          key: rerank-${{ hashFiles('tools/fetch_rerank.sh') }}
      - name: 下载重排模型
        if: steps.models.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载词典
        env:
          TAG: ${{ inputs.tag }}
          TIER: ${{ matrix.tier }}
          GRAM: ${{ inputs.gram }}
        run: |
          if [ -n "$TAG" ]; then
            base="https://github.com/ukjent7/lueying-dict/releases/download/${TAG}"
            curl -fsSL --retry 5 --retry-delay 15 -o data/main.pyd "${base}/main-${TIER}.pyd"
            curl -fsSL --retry 5 --retry-delay 15 -o data/collocation.bin "${base}/${GRAM}"
          else
            bash tools/fetch_dict.sh data
          fi
      # 父提交的逐条结果:缓存键相同时直接取用(目录 base/,只含 TSV 与加密文件)。
      - name: 取父提交的缓存结果
        id: base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base
          key: ${{ needs.build.outputs.base-key }}-${{ matrix.tier }}-${{ matrix.shard }}
      - name: 跑父提交的分片
        if: steps.base.outputs.cache-hit != 'true'
        env:
          EVAL_KEY: ${{ secrets.EVAL_KEY }}
          TEST: ${{ inputs.test }}
          SHARD: ${{ matrix.shard }}
          TOTAL: "8"
        run: |
          chmod +x base-bin/lueying-bench
          mkdir -p "$RUNNER_TEMP/base-run" base
          bash tools/bench_shard.sh base-bin/lueying-bench "$RUNNER_TEMP/base-run" "$SHARD/$TOTAL"
          find "$RUNNER_TEMP/base-run/target/bench" -name '*.tsv' -exec mv -t base {} +
          find "$RUNNER_TEMP/base-run/target/bench" -name '*.gpg' -exec mv -t base {} +
      - name: 跑分片
        env:
          EVAL_KEY: ${{ secrets.EVAL_KEY }}
          TEST: ${{ inputs.test }}
          SHARD: ${{ matrix.shard }}
          TOTAL: "8"
        run: |
          chmod +x lueying-bench
          bash tools/bench_shard.sh lueying-bench . "$SHARD/$TOTAL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: items-${{ matrix.tier }}-${{ matrix.shard }}
          path: |
            target/bench/*.tsv
            target/bench/*.feat
            target/bench/*.gpg
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-items-${{ matrix.tier }}-${{ matrix.shard }}
          path: |
            base/*.tsv
            base/*.gpg
          retention-days: 1
      # 缓存的是当前提交的逐条结果,下一次运行就是它的父提交对照。带补丁的运行不存。
      - name: 换成当前提交的结果
        if: needs.build.outputs.save == 'true'
        run: |
          rm -rf base && mkdir base
          cp target/bench/*.tsv target/bench/*.gpg base/ 2>/dev/null || true
      - name: 存当前提交的缓存结果
        if: needs.build.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base
          key: ${{ needs.build.outputs.head-key }}-${{ matrix.tier }}-${{ matrix.shard }}

  report:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: items-*
          path: items
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: base-items-*
          path: base-items
      - name: 合并、配对与门限
        env:
          EVAL_KEY: ${{ secrets.EVAL_KEY }}
        run: |
          GPG="gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 0"
          status=0
          for dir in items/* base-items/*; do
            name=$(basename "$dir")
            case "$name" in
              base-items-*) out=base; tier=${name#base-items-} ;;
              *) out=results; tier=${name#items-} ;;
            esac
            tier=${tier%-*}
            mkdir -p "$out/$tier"
            cp "$dir"/* "$out/$tier/"
          done
          for tier in results/*; do
            name=$(basename "$tier")
            for file in "$tier"/*.gpg base/"$name"/*.gpg; do
              [ -f "$file" ] && printf %s "$EVAL_KEY" | $GPG --decrypt -o "${file%.gpg}" "$file"
            done
            # 门限只卡随包的档位,小档位用来看体积和准确率的取舍。
            # 每个档位都与父提交配对:退步的显著性与干净全拼的净退步在 summarize --gate 里判。
            gate=""
            case "$name" in
              main|600k) gate=--gate ;;
            esac
            python3 tools/bench_shared.py summarize "$tier" --base "base/$name" $gate || status=1
            rm -f "$tier"/eval-private-*.tsv "$tier"/eval-user-*.tsv "base/$name"/eval-private-*.tsv "base/$name"/eval-user-*.tsv
            jq -r --arg t "$name" 'to_entries[] | .key as $c | .value as $s | $s.categories | to_entries[]
              | "| \($t) | \($c) | \(.key) | \(.value.settled.n) | \(.value.engine.top1) | \(.value.settled.top1) | \(.value.settled.top5) | \($s.paired[.key].regressed // "-") | \($s.paired[.key].improved // "-") | \($s.paired[.key].p // "-") |"' \
              "$tier/summary.json" >> rows.txt
          done
          { echo "| 档位 | 语料 | 类别 | 条数 | 引擎 top1 | 全链路 top1 | top5 | 退步 | 进步 | p |"; echo "|---|---|---|---:|---:|---:|---:|---:|---:|---:|"; cat rows.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: results
