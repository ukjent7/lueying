# 词典体积 × 准确率扫描:同一份引擎、搭配表与重排模型,逐档跑共享语料基准。
# 词典由 lueying-dict 的 Release 提供;手动触发,结果在 Summary 与 artifact 里。
name: dict-bench

on:
  workflow_dispatch:
    inputs:
      tag:
        description: lueying-dict Release 标签
        required: true
      tiers:
        description: 空格分隔的档位,对应资产 main-<档位>.pyd
        required: true
        default: 200k 400k 600k 800k
      gram:
        description: 搭配表资产名
        required: true
        default: collocation.bin

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 下载模型
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 构建 E2E
        run: cargo build -p lueying-e2e --release --locked
      - name: 逐档基准
        env:
          TAG: ${{ inputs.tag }}
          TIERS: ${{ inputs.tiers }}
          GRAM: ${{ inputs.gram }}
        run: |
          base="https://github.com/ukjent7/lueying-dict/releases/download/${TAG}"
          mkdir -p results
          curl -fsSL --retry 3 -o data/collocation.bin "${base}/${GRAM}"
          for tier in $TIERS; do
            curl -fsSL --retry 3 -o "data/main-${tier}.pyd" "${base}/main-${tier}.pyd"
            # 门限不达标也要继续跑下一档,结论看整张表。
            ./target/release/lueying-e2e --dict "data/main-${tier}.pyd" --gram data/collocation.bin \
              --rerank-dir data/rerank --only-shared > "results/${tier}.log" 2>&1 || true
            mkdir -p "results/${tier}"
            cp target/bench-shared.json target/bench-shared.tsv target/e2e-report.md "results/${tier}/" || true
            {
              echo "## ${tier}: $(stat -c %s "data/main-${tier}.pyd" | awk '{printf "%.2f MiB", $1/1048576}')"
              cat "results/${tier}/e2e-report.md" || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dict-bench-${{ inputs.tag }}
          path: results
