# 词典与引擎的共享语料基准:编译一次,按档位 × 分片铺到多台 runner,合并成 summary.json。
# 机器读 artifact 里的逐条 TSV 与 summary.json;比较两次运行用 tools/bench_shared.py diff。
# tag 留空时测 fetch_dict.sh 钉住的词典(档位名 main),quality 这样调用。
name: dict-bench

on:
  workflow_dispatch:
    inputs:
      tag:
        description: lueying-dict Release 标签,留空用钉住的词典
        required: false
        default: ""
      tiers:
        description: 空格分隔的档位,对应资产 main-<档位>.pyd
        required: true
        default: main
      gram:
        description: 搭配表资产名
        required: false
        default: collocation.bin
      patch:
        description: 构建前对 query.rs 与 rerank 执行的 sed -E 脚本,扫常量用
        required: false
        default: ""
      diff:
        description: 构建前应用的补丁(git diff | xz | base64),改动不进 main 也能跑基准
        required: false
        default: ""
      test:
        description: 同时跑 V2 测试集,只在发版时勾
        type: boolean
        default: false
  # lueying-dict 的 pipeline 发布后直接调用,公开仓库之间不需要令牌。
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      tiers:
        type: string
        default: main
      gram:
        type: string
        default: collocation.bin
      patch:
        type: string
        default: ""
      diff:
        type: string
        default: ""
      test:
        type: boolean
        default: false
    secrets:
      EVAL_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 私有语料加密放在仓库里,解密后的文字和逐条结果都不能进日志或公开 artifact。
  GPG: gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tiers: ${{ steps.tiers.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 应用补丁
        if: inputs.diff != ''
        env:
          DIFF: ${{ inputs.diff }}
        run: printf %s "$DIFF" | base64 -d | xz -d | git apply
      - name: 调整引擎常量
        if: inputs.patch != ''
        env:
          PATCH: ${{ inputs.patch }}
        run: |
          sed -i -E "$PATCH" crates/engine/src/query.rs crates/rerank/src/lib.rs
          git diff --stat --exit-code && exit 1 || git diff
      - name: 构建 E2E
        run: cargo build -p lueying-e2e --release --locked
      - name: 展开档位
        id: tiers
        env:
          TIERS: ${{ inputs.tiers }}
        run: echo "json=$(jq -cn --arg t "$TIERS" '$t | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: target/release/lueying-e2e
          retention-days: 1

  # 带补丁的基准同时跑静态检查、单元测试与场景 E2E,结果好再提交时不用再等一轮。
  check:
    if: inputs.diff != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 应用补丁
        env:
          DIFF: ${{ inputs.diff }}
        run: printf %s "$DIFF" | base64 -d | xz -d | git apply
      - name: Clippy
        run: cargo clippy -p lueying-engine -p lueying-rerank -p lueying-session -p lueying-features -p lueying-e2e --all-targets --locked -- -D warnings
      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-nextest
      - name: 单元测试
        run: cargo nextest run -p lueying-engine -p lueying-rerank -p lueying-session -p lueying-features --locked
      - name: 下载词典与模型
        run: |
          bash tools/fetch_dict.sh data
          bash tools/fetch_rerank.sh data/rerank
      - name: 构建官方 guest
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          cp target/wasm32-unknown-unknown/release/shot_ocr.wasm extensions/shot-ocr/extension.wasm
          cp target/wasm32-unknown-unknown/release/clipboard_history.wasm extensions/clipboard-history/extension.wasm
          cp target/wasm32-unknown-unknown/release/voice_asr.wasm extensions/voice-asr/extension.wasm
      - name: 场景 E2E
        run: cargo run -p lueying-e2e --release --locked -- --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank --bench-fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-report
          path: |
            target/e2e-report.md
            target/bench-report.md
            target/e2e-failures.txt

  run:
    needs: build
    runs-on: ubuntu-latest
    # 语料增多后单片常超过 60 分钟(曾整片超时被取消),留足余量。
    # 8 片并行:语料约 1.4 万条,4 片时单片近 60 分钟。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.build.outputs.tiers) }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
      - name: 缓存重排模型
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/rerank
          key: rerank-${{ hashFiles('tools/fetch_rerank.sh') }}
      - name: 下载重排模型
        if: steps.models.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载词典
        env:
          TAG: ${{ inputs.tag }}
          TIER: ${{ matrix.tier }}
          GRAM: ${{ inputs.gram }}
        run: |
          if [ -n "$TAG" ]; then
            base="https://github.com/ukjent7/lueying-dict/releases/download/${TAG}"
            curl -fsSL --retry 5 --retry-delay 15 -o data/main.pyd "${base}/main-${TIER}.pyd"
            curl -fsSL --retry 5 --retry-delay 15 -o data/collocation.bin "${base}/${GRAM}"
          else
            bash tools/fetch_dict.sh data
          fi
      - name: 跑分片
        env:
          SHARD: ${{ matrix.shard }}
          TEST: ${{ inputs.test }}
          EVAL_KEY: ${{ secrets.EVAL_KEY }}
        run: |
          chmod +x lueying-e2e
          corpora=("" "--corpus dicts/eval-extra-v1.tsv" "--corpus dicts/eval-dev-v4.tsv" "--corpus dicts/eval-user-v1.tsv" "--corpus dicts/eval-user-v2.tsv" "--corpus dicts/eval-user-v3.tsv" "--corpus dicts/eval-user-v4.tsv")
          if [ "$TEST" = true ]; then corpora+=("--corpus dicts/eval-v2-test.tsv" "--corpus dicts/eval-v3-test.tsv"); fi
          if [ -n "$EVAL_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/private"
            printf %s "$EVAL_KEY" | $GPG --decrypt dicts/eval-private.tar.gpg | tar xz -C "$RUNNER_TEMP/private"
            corpora+=("--corpus $RUNNER_TEMP/private/eval-private-dev.tsv")
            if [ "$TEST" = true ]; then corpora+=("--corpus $RUNNER_TEMP/private/eval-private-test.tsv"); fi
          fi
          for corpus in "${corpora[@]}"; do
            ./lueying-e2e --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank \
              --only-shared --shard "$SHARD/8" $corpus
          done
          for file in target/bench/eval-private-*.tsv; do
            [ -f "$file" ] || continue
            printf %s "$EVAL_KEY" | $GPG --symmetric --cipher-algo AES256 -o "$file.gpg" "$file"
            rm "$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: items-${{ matrix.tier }}-${{ matrix.shard }}
          path: |
            target/bench/*.tsv
            target/bench/*.feat
            target/bench/*.gpg
          retention-days: 1

  report:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukjent7/lueying
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: items-*
          path: items
      - name: 合并
        env:
          EVAL_KEY: ${{ secrets.EVAL_KEY }}
        run: |
          status=0
          for dir in items/*; do
            name=$(basename "$dir")
            tier=${name#items-}
            tier=${tier%-*}
            mkdir -p "results/$tier"
            cp "$dir"/* "results/$tier/"
          done
          for tier in results/*; do
            for file in "$tier"/*.gpg; do
              if [ -f "$file" ]; then printf %s "$EVAL_KEY" | $GPG --decrypt -o "${file%.gpg}" "$file"; fi
            done
            # 门限只卡随包的档位,小档位用来看体积和准确率的取舍。
            # main 档另外对照 dicts/bench-baseline.json:干净全拼首选不能低于基线(改基线要在提交里说明)。
            gate=""
            baseline=""
            case "$(basename "$tier")" in
              main) gate=--gate; baseline="--baseline dicts/bench-baseline.json" ;;
              600k) gate=--gate ;;
            esac
            python3 tools/bench_shared.py summarize "$tier" $gate $baseline || status=1
            rm -f "$tier"/eval-private-*.tsv
            jq -r --arg t "$(basename "$tier")" 'to_entries[] | .key as $c | .value.categories | to_entries[]
              | "| \($t) | \($c) | \(.key) | \(.value.settled.n) | \(.value.engine.top1) | \(.value.settled.top1) | \(.value.settled.top5) |"' \
              "$tier/summary.json" >> rows.txt
          done
          { echo "| 档位 | 语料 | 类别 | 条数 | 引擎 top1 | 全链路 top1 | top5 |"; echo "|---|---|---|---:|---:|---:|---:|"; cat rows.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: results
