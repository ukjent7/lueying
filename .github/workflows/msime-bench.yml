# 水杉在共享语料上的逐条结果,手动触发,和 dict-bench 的报告并排比较。
name: msime-bench

on:
  workflow_dispatch:
    inputs:
      ref:
        description: metasequoiaime/msime 的分支或提交
        required: true
        default: main

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metasequoiaime/msime
          ref: ${{ inputs.ref }}
          path: msime
          persist-credentials: false
      - name: 跑三种配置
        run: |
          mkdir -p results
          python3 tools/bench_shared.py export --engine msime --out results/shared.tsv
          python3 tools/bench_shared.py export --engine msime --corpus dicts/eval-extra-v1.tsv --out results/extra.tsv
          python3 tools/bench_shared.py export --engine msime --corpus dicts/eval-v2-dev.tsv --out results/v2.tsv
          cd msime
          resources=$(cargo run --release -p msime-client-core --example install_resources -- "$RUNNER_TEMP/resources" | tail -1)
          cargo build --release -p msime-input-runtime --example convert_eval
          # 默认:词库 + 词格 n-gram,神经模型默认关闭。convert_eval 见到模型就挂,所以拿掉。
          cp -rL "$resources" "$RUNNER_TEMP/default"
          chmod -R u+w "$RUNNER_TEMP/default"
          rm "$RUNNER_TEMP/default/sentence-model.safetensors"
          # 全开:再加按需下载的桌面模型。
          cp -rL "$resources" "$RUNNER_TEMP/full"
          chmod -R u+w "$RUNNER_TEMP/full"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/full/sentence-model-desktop.safetensors" \
            "$(jq -r '.artifacts[0].url' resources/settled-model.lock.json)"
          # convert_eval 按锁文件核对资源目录,增减模型要带上对应的锁。
          lock=resources/desktop-dictionary.lock.json
          jq 'del(.artifacts[] | select(.name == "sentence-model.safetensors"))' "$lock" > "$RUNNER_TEMP/default.lock.json"
          cp "$lock" "$RUNNER_TEMP/keyboard.lock.json"
          jq --slurpfile extra resources/settled-model.lock.json '.artifacts += $extra[0].artifacts' "$lock" > "$RUNNER_TEMP/full.lock.json"
          for arm in default keyboard full; do
            dir="$RUNNER_TEMP/$arm"
            [ "$arm" = keyboard ] && dir="$resources"
            for corpus in shared extra v2; do
              ./target/release/examples/convert_eval --resources "$dir" --resource-lock "$RUNNER_TEMP/$arm.lock.json" \
                --set "../results/$corpus.tsv" --dump "../results/$arm-$corpus.jsonl" > /dev/null
              python3 ../tools/bench_shared.py import-msime --dump "../results/$arm-$corpus.jsonl" \
                --out "../results/$arm-$corpus.tsv"
            done
          done
      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-bench
          path: results
