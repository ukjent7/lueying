# 换注音的影子对照:金标读音语料上模拟真实打字,逐词核对现役词典的读音。
# 只产出裁决表(artifact),不改任何东西;一致率与分歧清单供切主决策。
name: arbitrate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arbitrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux
      - name: 取词典与模型
        run: |
          bash tools/fetch_dict.sh data
          bash tools/fetch_rerank.sh data/rerank
      - name: 取金标读音语料
        run: |
          curl -fsSL --retry 5 --retry-delay 15 -o data/sampled.jsonl.gz \
            "https://github.com/ukjent7/chinese-ime-lm/raw/main/eval/sentences-ctx-v1/sampled.jsonl.gz"
      - name: 构建
        run: cargo build -p lueying-e2e --release --locked
      - name: 读音仲裁
        run: |
          target/release/lueying-e2e \
            --dict data/main.pyd \
            --collocation data/collocation.bin \
            --rerank-dir data/rerank \
            --arbitrate data/sampled.jsonl.gz \
            --arbitrate-out target/arbitrate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arbitrate
          path: target/arbitrate.json
          retention-days: 14
