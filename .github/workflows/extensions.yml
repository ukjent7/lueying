# 原生扩展独立发版:ppocr.exe 的 ONNX 依赖又大又慢,主 CI 不再编译它,
# 只按 manifest 版本下载对应 Release 资产;升级扩展代码时先打 ppocr-v* 标签。
name: extensions

on:
  push:
    tags: ["ppocr-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ppocr:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: 构建 ppocr
        run: cargo build --release --locked -p ppocr
      - name: 发布 Release 资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content extensions/ppocr/manifest.json -Raw | ConvertFrom-Json
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "ppocr-v$($manifest.version)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ppocr.exe dist/lueying-ppocr.exe
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/lueying-ppocr.exe --clobber
          } else {
            gh release create $tag dist/lueying-ppocr.exe --title "PP-OCRv6 原生扩展 $($manifest.version)" --notes "PP-OCRv6 原生扩展 $($manifest.version)"
          }
          if ($LASTEXITCODE -ne 0) { throw "扩展 Release 发布失败" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lueying-ppocr
          path: dist/lueying-ppocr.exe
