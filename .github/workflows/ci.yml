# push/PR:格式、构建、静态检查、单测与 Windows 构建体积门禁;主分支每次推送出测试安装包。
# 场景 E2E、候选基准与安装冒烟在 quality.yml:核心路径改动在 push 到 main 时由本工作流调用,手动触发也跑。
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 只校验格式,不改代码:不合格直接红,由作者本地 cargo fmt 后再推。
  # Cargo.lock 入库;清单与锁失配由各 job 的 --locked 挡住。
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format 校验
        run: cargo fmt --all --check

  # 改动分级:核心路径(引擎、词典、会话、特征、输入方案与词典数据)动了,才在 push 到 main 时
  # 调用 quality.yml。手动触发一律跑全量;PR 与其余改动只跑上面的基本检查。
  changes:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.check.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 比对 before..sha 需要完整历史;浅克隆里父提交不存在。
          fetch-depth: 0
          persist-credentials: false
      - name: 判定核心路径改动
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          core_re='^(crates/(dict|engine|lm|rerank|session|features)/|extensions/input-schemes/|dicts/|tools/(fetch_dict\.sh|fetch_rerank\.sh|bench_shared\.py)$)'
          # 手动触发跑全量;新分支首推(before 全零)或历史缺失时保守地当作核心改动。
          if [ "$EVENT" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            core=true
          elif git diff --name-only "$BEFORE" "$SHA" | grep -Eq "$core_re"; then
            core=true
          else
            core=false
          fi
          echo "核心路径改动: $core"
          echo "core=$core" >> "$GITHUB_OUTPUT"

  # 核心路径改动:场景 E2E、准确率与延迟红线、共享语料基准、Windows E2E 与安装冒烟,整套复用 quality.yml。
  quality:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  engine:
    # 与 fmt 并行跑:格式检查不挡构建与测试。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
          prefix-key: linux
      # 工具链固定,警告即失败;偶发的新 lint 先修再合。
      - name: Clippy
        run: cargo clippy --workspace --exclude ppocr --all-targets --locked -- -D warnings
      # nextest 按测试进程并行,多 crate 单测一次跑完;范围与逐 crate 时代相同,
      # 只换执行器,不新增测试面。
      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-nextest
      # 组件缝验证桩:lueying-ext 宿主的测试要在运行时把 guest 包成组件。
      - name: 安装 wasm-tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-tools
      - name: 单元测试
        run: |
          cargo nextest run --locked \
            -p lueying-engine -p lueying-protocol -p lueying-render \
            -p lueying-lm -p lueying-rerank -p lueying-server
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --exclude ppocr --locked
      # nextest 不跑文档测试;ext 的「最小模块」示例是可编译用例,单独保留。
      - name: 文档测试
        run: cargo test --doc --workspace --exclude ppocr --locked
      # 运行期 Wasm 官方 guest 用 wasm32 工具链编一遍:SDK 或扩展编不过在这里红。
      # 产物包成组件放进扩展目录,扩展层单测与 Linux E2E 都用仓库路径读取。
      - name: Wasm guest 构建
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          wasm-tools component new target/wasm32-unknown-unknown/release/shot_ocr.wasm -o extensions/shot-ocr/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/clipboard_history.wasm -o extensions/clipboard-history/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/voice_asr.wasm -o extensions/voice-asr/extension.wasm
      # 组件测试客人:扩展宿主行为测试的真实组件(SDK 编出 + wasm-tools 打包)。
      # 独立 crate,自带锁文件生成,不加 --locked。
      - name: 组件测试客人构建
        run: |
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-a.wasm
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown --features variant-b
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-b.wasm
          echo "LUEYING_FIXTURE_WASM=$PWD/target/fixture-a.wasm" >> "$GITHUB_ENV"
          echo "LUEYING_FIXTURE_B_WASM=$PWD/target/fixture-b.wasm" >> "$GITHUB_ENV"
      # JS 组件客人:非 Rust 工具链(componentize-qjs)的端到端验证。
      # --sync 出非 async 组件,宿主按同步组件实例化;QuickJS 产物不到
      # 1 MiB,默认限额内即可运行。
      - name: JS 组件客人构建
        run: |
          cd crates/ext/tests/js-guest
          npm install --no-fund --no-audit --loglevel=error
          npx componentize-qjs --wit ../../lueying.wit --js guest.js --world extension --sync --opt-size --minify -o "$GITHUB_WORKSPACE/target/js-fixture.wasm"
          echo "LUEYING_JS_FIXTURE_WASM=$GITHUB_WORKSPACE/target/js-fixture.wasm" >> "$GITHUB_ENV"
      # 扩展层单测:清单、权限与补丁的边界矩阵,E2E 覆盖不到的取值组合;
      # CLI 的子命令解析与扩展宿主的白名单、规范化同场。
      - name: 扩展层单元测试
        run: |
          cargo nextest run --locked \
            -p lueying-ext --all-features \
            -p lueying-ext-host -p lueying-cli -p lueying-net

  windows:
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    # 打 tag 时创建 Release;其他触发只读。
    permissions:
      contents: write
    steps:
      # 与 engine 一致按事件 SHA 检出;tag 构建检出的就是打 tag 的那个提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 缓存只留 windows job(Windows 原生链路编译最慢,Linux job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      # 官方 guest:win-e2e 装扩展与发布包都要它;产物拷进仓库路径供运行期读取。
      - name: 安装 wasm-tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-tools
      - name: 构建官方 guest
        shell: pwsh
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          wasm-tools component new target/wasm32-unknown-unknown/release/shot_ocr.wasm -o extensions/shot-ocr/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/clipboard_history.wasm -o extensions/clipboard-history/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/voice_asr.wasm -o extensions/voice-asr/extension.wasm
      # 扩展自检的外观客人:fixture-guest 编出的组件(固定主题色)。
      - name: 组件测试客人构建
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target"
          cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-a.wasm
          "LUEYING_SELFTEST_WASM=$PWD/target/fixture-a.wasm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # 测试安装包(push 到 main)与发版打包共用同一份 Inno 脚本;PR 不需要安装器。
      # 直接下载固定版本,避免 choco 包版本漂移。
      - name: 安装 Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          # 上游资产偶发 504,带重试。
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup -MaximumRetryCount 5 -RetryIntervalSec 15
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败" }
          "LUEYING_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # ARM64 安装被 lueying.iss 明确拒绝:ARM64 与 x64 共用同一份 64 位注册表
      # 视图,原生宿主能加载的 TSF 得做成 ARM64X DLL,目前没有。这里仍做真实
      # 链接而不只是 check,保证该目标随时可产出可用的原生 DLL。
      # TSF DLL 装在宿主进程里,必须静态链接 CRT(见 .cargo/config.toml),
      # 所以单独一个 target 目录 + 显式 RUSTFLAGS,不碰主构建目录。
      - name: ARM64 TSF 构建
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --release -p lueying-tsf --target aarch64-pc-windows-msvc --locked
      # Clippy 已在 Linux engine job 跑过;Windows 这份只观察、不阻断,纯属重复编译。
      - name: Build (release)
        id: build
        # 只编发版真正用到的包;E2E 宿主只在手动触发、打 tag 与 quality.yml 里编。
        # 安装冒烟成本更高,留在 quality.yml 跑。
        # TSF 不在这里:它要静态 CRT,单独一步构建。
        run: cargo build --release --locked -p lueying-server -p lueying-ext-host -p lueying-net -p lueying-installer
      # 常驻进程不联网的可证明约束:按键与词库都在 lueying-server 手里,它的
      # 导入表不得出现 winhttp;联网只允许出现在设置窗与更新器的交互路径。
      - name: 常驻进程导入表断言
        shell: pwsh
        run: |
          $imports = & "C:\Program Files\LLVM\bin\llvm-objdump.exe" -x target/release/lueying-server.exe |
            Select-String -Pattern 'winhttp'
          if ($imports) {
            $imports | ForEach-Object { Write-Host $_ }
            throw "lueying-server.exe 的导入表出现 winhttp,常驻进程联网约束被破坏"
          }
      # 服务提供者(服务缝 T3)的 Windows 集成验证:真 GDI 截图、真 WinRT 识别
      # 与热键注册语义;语言包缺失时只接受确定性的「没有可用引擎」失败。
      # 平台无关的服务端单测已在 Linux 的 engine job 跑过;Windows 这份只留平台特有
      # 路径,挂到发版构建,push 门禁省下三分多钟的测试编译。
      - name: 服务端单元测试(Windows)
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success'
        run: |
          cargo test -p lueying-server --lib --release --locked
      # TSF DLL(64 位):静态 CRT,独立 target 目录;产物拷回 target/release 供打包用。
      - name: TSF 构建(静态 CRT)
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p lueying-tsf
          Copy-Item target/tsf/release/lueying_tsf.dll target/release/lueying_tsf.dll -Force
      # 运行时体积基线:2026-10-31 实测 server 33.6 + settings 22.1 +
      # user 0.6 + TSF 0.7 ≈ 57 MiB(自研更新器已砍,更新改设置窗直接
      # 下载安装包)。候选窗早已走 D2D,Skia 现已整条删除。设置窗用
      # Slint(winit + 软件渲染),体积门限 90 MiB;Windows 实测出 Slint
      # 的真实增量后收紧。发布包另有总门禁。
      - name: 运行时体积门禁
        shell: pwsh
        run: |
          $names = "lueying-server.exe", "lueying-ext-host.exe", "lueying-settings.exe", "lueying-user.exe", "lueying_tsf.dll"
          $bytes = 0
          foreach ($name in $names) {
            $length = (Get-Item "target/release/$name").Length
            $bytes += $length
            "{0} {1:N1} MiB" -f $name, ($length / 1MB)
          }
          "{0:N1} MiB / 90 MiB" -f ($bytes / 1MB)
          if ($bytes -gt 90MB) { throw "运行时体积超过 90 MiB" }
      - name: Build Windows E2E harness
        id: build_e2e
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked -p lueying-win-e2e
      - name: Build install E2E harness
        id: build_install
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked -p lueying-install-e2e
      - name: Windows 全链路 E2E
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build_e2e.outcome == 'success'
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 安装/卸载冒烟
        # 构建失败时没有 lueying-user.exe,这条只会在日志里添一条假失败。
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build_install.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      # Setup 在语言/提权问题下会在写 /LOG 前退出,默认日志落在 %TEMP%。
      # 失败时把两份都收进 artifact,否则只剩一个退出码。
      - name: 收集安装日志
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $dst = "target/install-e2e-logs"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dst -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory -Filter "lueying-install-e2e-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.log" -File -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.DirectoryName -Leaf
              Copy-Item $_.FullName (Join-Path $dst "$dir-$($_.Name)") -ErrorAction SilentlyContinue
            }
          }
      - name: 报告摘要
        if: always()
        shell: pwsh
        run: |
          if (Test-Path target/win-e2e-report.md) {
            Get-Content target/win-e2e-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-e2e-report
          path: |
            target/win-e2e-report.md
            target/ext-verify-report.md
            target/v3-frames.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/lueying-settings-selftest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: install-e2e-report
          path: |
            target/install-e2e-report.md
            # 安装冒烟卡死时没有报告,阶段跟踪是唯一线索。
            target/install-e2e-trace.log
            # 子进程输出走文件,超时/非零退出时看最后一段。
            target/install-e2e-logs/
      # 发布目录在手动触发、push 到 main 与打 tag 时生成;push 到 main 只出测试安装包(见校验步骤后的 artifact),
      # 不签名、不发 Release。tag 构建同时上传 setup.exe/sha256 并创建 Release;
      # 代码签名是脚手架:配了 secret 才签,没配就维持未签名发布。
      - name: 下载词典与搭配表(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        run: bash tools/fetch_dict.sh data
      - name: 下载神经重排模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载 PP-OCRv6 模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_ppocr.sh data/ppocr
      - name: 读取发布版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须是 vX.Y.Z 或 vX.Y.Z-预发布: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          python .github/changelog_section.py "$version" --check
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version_args=()
          if [ -n "${VERSION:-}" ]; then version_args=(--version "$VERSION"); fi
          cargo run -p xtask --release --locked -- pack --bin target/release --data data --out dist/lueying "${version_args[@]}"
      # 签名脚手架:仓库里配 WINDOWS_PFX_BASE64(PFX 证书的 base64)与
      # WINDOWS_PFX_PASSWORD 两个 secret 后,tag 构建自动签 setup.exe 并加
      # RFC3161 时间戳;没配 secret 时跳过,发布物与现状一致。
      - name: 代码签名(有证书才执行)
        # if 里不能用 secrets 上下文,判空放进脚本。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { "未配置证书,跳过签名"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "lueying.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "找不到 signtool.exe" }
          $setup = "dist/lueying-$env:VERSION-setup.exe"
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "signtool 失败" }
          Remove-Item $pfx
      - name: 校验发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -f dist/lueying/LICENSE
          test -f dist/lueying/licenses/Apache-2.0.txt
          test -f dist/lueying/licenses/CC-BY-4.0.txt
          test -f dist/lueying/lueying-user.exe
          test -f dist/lueying/lueying_tsf.dll
          test -f dist/lueying/collocation.bin
          ls dist/lueying-*-setup.exe >/dev/null
          if [ -n "${VERSION:-}" ]; then
            test "$(cat dist/lueying/version.txt)" = "$VERSION"
            test -f "dist/lueying-$VERSION-setup.exe"
          fi
          du -sh dist/lueying
          ls -lh dist/lueying-*-setup.exe
      # 主分支每次推送的测试安装包;artifact 名带短提交号,重跑同一提交时覆盖旧包。
      - name: 取短提交号
        id: short
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: lueying-setup-${{ steps.short.outputs.sha }}
          path: dist/lueying-*-setup.exe
          if-no-files-found: error
          overwrite: true
      # ppocr.exe 由 extensions.yml 单独发 Release,主发布不带这份资产。
      - name: 生成安装包校验文件
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw "缺少 VERSION" }
          $setup = "dist/lueying-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "缺少 $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lueying-$version-setup.exe" | Set-Content -Path "$setup.sha256" -Encoding ascii -NoNewline
          Get-Item $setup | Select-Object Name, Length
      # 签名更新清单:客户端内置公钥验签后才信镜像与哈希;私钥是 64 位十六进制
      # 的 Ed25519 种子,存在 LUEYING_SIGN_KEY secret。未配置时只上传不签名清单,
      # 客户端退回 .sha256 流程。
      - name: 生成签名更新清单
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          LUEYING_SIGN_KEY: ${{ secrets.LUEYING_SIGN_KEY }}
        run: |
          $version = $env:VERSION
          if (-not $version) { throw "缺少 VERSION" }
          $setup = "dist/lueying-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "缺少 $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $mirror = "https://github.com/ukjent7/lueying/releases/download/$env:GITHUB_REF_NAME/lueying-$version-setup.exe"
          cargo run -p xtask --release --locked -- update-manifest `
            --version $version `
            --name "lueying-$version-setup.exe" `
            --size (Get-Item $setup).Length `
            --sha256 $hash `
            --mirror $mirror `
            --out dist
          if ($env:LUEYING_SIGN_KEY) {
            cargo run -p xtask --release --locked -- sign-manifest `
              --manifest dist/lueying-manifest.json --key-env LUEYING_SIGN_KEY
          } else {
            "未配置 LUEYING_SIGN_KEY,清单不签名;客户端退回 .sha256 流程"
          }
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $tag = $env:GITHUB_REF_NAME
          $setup = "dist/lueying-$version-setup.exe"
          $sha = "$setup.sha256"
          $assets = @($setup, $sha)
          if (Test-Path "dist/lueying-manifest.json") { $assets += "dist/lueying-manifest.json" }
          if (Test-Path "dist/lueying-manifest.json.sig") { $assets += "dist/lueying-manifest.json.sig" }
          # Release 说明来自 CHANGELOG 的版本段,不用自动生成的提交列表。
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          python .github/changelog_section.py $version --out $notes
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $notes)) { throw "缺少 CHANGELOG 版本段" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --notes-file $notes
          } elseif ($version.Contains('-')) {
            # 预发布不能成为 releases/latest,否则稳定版用户会被升级到 beta。
            gh release create $tag @assets --title "掠影 $version" --notes-file $notes --prerelease
          } else {
            gh release create $tag @assets --title "掠影 $version" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 发布失败" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: lueying-windows
          path: |
            dist/lueying
            dist/lueying-*-setup.exe
            dist/lueying-*-setup.exe.sha256
            dist/lueying-manifest.json
            dist/lueying-manifest.json.sig
