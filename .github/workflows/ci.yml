# push/PR:构建、静态检查、快速 E2E、共享语料基准与 64 位 Windows 全链路 E2E。
# 全量语料、x86 与安装冒烟在 quality.yml 定时跑。
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式化 + 维护 Cargo.lock,有变化就回推(仅 push 到 main;GITHUB_TOKEN 推送不触发新 run)。
  # 锁文件必须入库:不锁则每次 run 重新解析版本,天然抖动。
  # 锁只在清单或锁本身变了、或锁已经跟清单失配时才更新;已有锁原样保留——
  # rust-cache 的键含锁哈希,锁稳定缓存才不会每次全量重存挤爆配额。
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 判断本次提交是否动了清单需要父提交;浅克隆里 HEAD^ 不存在。
          fetch-depth: 2
      # 只有这次 push 动了清单/锁或锁已经跟清单失配时才重新解析;其余情况直接跳过,
      # 避免把 fmt 这个本该几秒的 job 拖成门禁。锁失配的另一种来路是上一次回推失败
      # (格式化先红、锁没落地),那种情况 git diff 看不出来,所以离线比对清单与锁
      # (.github/lock_in_sync.py)。
      - name: 维护 Cargo.lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -Eq '(^|/)Cargo\.(toml|lock)$' && python3 .github/lock_in_sync.py; then
            echo "清单与锁未变化,跳过依赖解析"
            exit 0
          fi
          # 锁跟不上清单时做一次最小更新:只补变动的那几个依赖,不动其它包的版本。
          cargo metadata --locked --format-version 1 >/dev/null 2>&1 || cargo metadata --format-version 1 >/dev/null
      - name: 格式化
        run: cargo fmt --all
      - name: 回推(如有变化)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "style: cargo fmt + Cargo.lock"
            (git pull --rebase && git push) || echo "推送被拒(并发提交撞车),下一轮 run 处理"
          fi
      - name: Format 校验
        run: cargo fmt --all --check

  engine:
    # 不等 fmt:格式化/lock 回推只影响下一轮,构建与测试没必要空等几分钟。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 按事件 SHA 检出,不与同一轮 fmt-bot 的回推抢 main;push 的 SHA 已包含上一轮的回推。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 工具链固定,警告即失败;偶发的新 lint 先修再合。
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      # 版本比较/SHA 解析在 protocol crate,纯逻辑在 Linux 上测,
      # 不必为此编译 Windows 原生链路。
      - name: Protocol 单元测试
        run: cargo test -p lueying-protocol --lib --locked
      # 扩展层单元测试:清单、权限与补丁的边界矩阵,E2E 覆盖不到的取值组合。
      - name: 扩展层单元测试
        run: cargo test -p lueying-extjs -p lueying-extmeta --lib --locked

  # 每次提交的快速质量门禁:全部 E2E 场景 + 快速候选基准 + 1444 条共享语料。
  # 全量语料、x86 与安装冒烟成本高,仍在 quality.yml 定时跑。
  quality:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skia 预编译二进制静态链进了系统 freetype/fontconfig,链接期要 -lfreetype/
      # -lfontconfig,也就是 .so 与 pkg-config 头文件;Ubuntu runner 镜像只有运行库。
      - name: 安装 Skia 链接依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      # 预编译命中门禁:特性集与 rust-skia 发布的键对不上时,这里几秒就红;
      # 否则会静默退化成十几分钟的本地编 Skia,还把原因埋在日志里。
      - name: Skia 预编译命中
        run: cargo build --release -p lueying-render --features prebuilt-only --locked
      # 单元测试补回归网密度;E2E 仍是主路径,这里只测纯逻辑边界。
      - name: 服务端单元测试
        run: cargo test -p lueying-server --lib --release --locked
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_frost.sh', 'tools/fetch_gram.sh', 'tools/fetch_rerank.sh', 'xtask/src/**', 'xtask/data/**', 'crates/dict/src/**', 'Cargo.lock') }}
      - name: 下载白霜词库
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_gram.sh data
      - name: 转换词典
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 快速 E2E + 共享语料基准
        run: cargo run -p lueying-e2e --release --locked -- --dict data/main.tsv --gram data/main.gram --rerank-dir data/rerank --bench-fast --bench-shared
      - name: 报告摘要
        if: always()
        shell: bash
        run: |
          for f in target/e2e-report.md target/bench-report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-fast-report
          path: |
            target/e2e-report.md
            target/bench-report.md
            target/bench-shared.json
            target/bench-shared.tsv

  windows:
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    # 打 tag 时创建 Release;其他触发只读。
    permissions:
      contents: write
    steps:
      # 与 engine 一致按事件 SHA 检出;tag 构建检出的就是打 tag 的那个提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 缓存只留 windows job(Windows 原生链路与 Skia 是编译大头,ubuntu 两个 job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      # 安装冒烟与发版打包共用同一份 Inno 脚本;push/PR 不需要安装器。
      # 直接下载固定版本,避免 choco 包版本漂移。
      - name: 安装 Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败" }
          "LUEYING_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # ARM64 安装被 lueying.iss 明确拒绝:ARM64 与 x64 共用同一份 64 位注册表
      # 视图,原生宿主能加载的 TSF 得做成 ARM64X DLL,目前没有。这里仍做真实
      # 链接而不只是 check,保证该目标随时可产出可用的原生 DLL。
      # TSF DLL 装在宿主进程里,必须静态链接 CRT(见 .cargo/config.toml),
      # 所以单独一个 target 目录 + 显式 RUSTFLAGS,不碰主构建目录。
      - name: ARM64 TSF 构建
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc
          cargo build --release -p lueying-tsf --target aarch64-pc-windows-msvc --locked
      # Skia 渲染核心 spike:d3d+textlayout+jpeg/pdf 组合必须命中预编译二进制;
      # 链接失败或触发本地编 Skia 都在这里暴露。d3d 特性由 render/server 的
      # cfg(windows) 依赖声明,无需 --features。prebuilt-only 让预编译缺失时
      # 立刻失败,而不是本地编 Skia 十几分钟后才失败。
      - name: Skia d3d 预编译命中
        run: cargo build --release -p lueying-render --features prebuilt-only --locked
      # Clippy 已在 Linux engine job 跑过;Windows 这份只观察、不阻断,纯属重复编译。
      - name: Build (release)
        id: build
        # 只编发版真正用到的包;64 位 E2E 宿主每次 push/PR 都编。
        # x86 与安装冒烟成本更高,留在 quality.yml 定时跑。
        # TSF 不在这里:它要静态 CRT,单独一步构建。
        run: cargo build --release --locked -p lueying-server -p lueying-installer
      # TSF DLL(64 位):静态 CRT,独立 target 目录;产物拷回 target/release 供打包用。
      - name: TSF 构建(静态 CRT)
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p lueying-tsf
          Copy-Item target/tsf/release/lueying_tsf.dll target/release/lueying_tsf.dll -Force
      - name: Build Windows E2E harness
        id: build_e2e
        run: cargo build --release --locked -p lueying-win-e2e
      - name: Build install E2E harness
        id: build_install
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked -p lueying-install-e2e
      - name: Build 32-bit TSF
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p lueying-tsf --target i686-pc-windows-msvc --locked
      - name: Stage 32-bit DLL for install E2E
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item target/tsf/i686-pc-windows-msvc/release/lueying_tsf.dll target/release/lueying_tsf32.dll
      - name: Build 32-bit E2E host
        id: build32
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release -p lueying-win-e2e --target i686-pc-windows-msvc --locked
      - name: Windows 全链路 E2E
        if: steps.build.outcome == 'success' && steps.build_e2e.outcome == 'success'
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 32 位 TSF 全链路 E2E
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build32.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "target/i686-pc-windows-msvc/release"
          Copy-Item target/release/lueying-server.exe $dir -Force
          # 设置窗是 64 位程序(TSF DLL 才是 32 位),自检要靠它。
          Copy-Item target/release/lueying-settings.exe $dir -Force
          # 32 位 TSF DLL 从静态 CRT 的独立目录来(见 TSF 构建步骤)。
          Copy-Item target/tsf/i686-pc-windows-msvc/release/lueying_tsf.dll $dir -Force
          # Server 是 64 位的,依赖的运行时 DLL 也要跟着过去;TSF DLL 保留 32 位。
          Get-ChildItem target/release -Filter *.dll -File |
            Where-Object { $_.Name -notlike "lueying_tsf*" } |
            Copy-Item -Destination $dir -Force
          New-Item -ItemType Directory -Force target/x86-e2e | Out-Null
          Push-Location target/x86-e2e
          & "..\i686-pc-windows-msvc\release\lueying-win-e2e.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: 安装/卸载冒烟
        # 构建失败时没有 lueying-user.exe,这条只会在日志里添一条假失败。
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build_install.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      # Setup 在语言/提权问题下会在写 /LOG 前退出,默认日志落在 %TEMP%。
      # 失败时把两份都收进 artifact,否则只剩一个退出码。
      - name: 收集安装日志
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $dst = "target/install-e2e-logs"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dst -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory -Filter "lueying-install-e2e-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.log" -File -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.DirectoryName -Leaf
              Copy-Item $_.FullName (Join-Path $dst "$dir-$($_.Name)") -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-e2e-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/lueying-settings-selftest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: x86-e2e-report
          path: |
            target/x86-e2e/target/win-e2e-report.md
            target/x86-e2e/target/win-e2e-tsf.log
            target/x86-e2e/target/win-e2e-server.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: install-e2e-report
          path: |
            target/install-e2e-report.md
            # 安装冒烟卡死时没有报告,阶段跟踪是唯一线索。
            target/install-e2e-trace.log
            # 子进程输出走文件,超时/非零退出时看最后一段。
            target/install-e2e-logs/
      # 发布目录只在手动触发或打 tag 时生成:每次 push 打包会重复下载模型并传 artifact,
      # 早期迭代只需要构建与 E2E 信号。tag 构建同时上传 setup.exe/sha256 并创建 Release;
      # 代码签名是脚手架:配了 secret 才签,没配就维持未签名发布。
      - name: 下载白霜词库(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_gram.sh data
      - name: 生成发布词典
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 读取发布版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须是 vX.Y.Z 或 vX.Y.Z-预发布: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version_args=()
          if [ -n "${VERSION:-}" ]; then version_args=(--version "$VERSION"); fi
          cargo run -p xtask --release --locked -- pack --bin target/release --bin32 target/tsf/i686-pc-windows-msvc/release --data data --out dist/lueying "${version_args[@]}"
      # 签名脚手架:仓库里配 WINDOWS_PFX_BASE64(PFX 证书的 base64)与
      # WINDOWS_PFX_PASSWORD 两个 secret 后,tag 构建自动签 setup.exe 并加
      # RFC3161 时间戳;没配 secret 时跳过,发布物与现状一致。
      - name: 代码签名(有证书才执行)
        # if 里不能用 secrets 上下文,判空放进脚本。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { "未配置证书,跳过签名"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "lueying.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "找不到 signtool.exe" }
          $setup = "dist/lueying-$env:VERSION-setup.exe"
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "signtool 失败" }
          Remove-Item $pfx
      - name: 校验发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -f dist/lueying/LICENSE
          test -f dist/lueying/licenses/Apache-2.0.txt
          test -f dist/lueying/licenses/CC-BY-4.0.txt
          test -f dist/lueying/lueying-user.exe
          test -f dist/lueying/lueying-update.exe
          test -f dist/lueying/lueying_tsf.dll
          test -f dist/lueying/lueying_tsf32.dll
          test -f dist/lueying/main.gram
          ls dist/lueying-*-setup.exe >/dev/null
          if [ -n "${VERSION:-}" ]; then
            test "$(cat dist/lueying/version.txt)" = "$VERSION"
            test -f "dist/lueying-$VERSION-setup.exe"
          fi
          du -sh dist/lueying
          ls -lh dist/lueying-*-setup.exe
      - name: 生成安装包校验文件
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw "缺少 VERSION" }
          $setup = "dist/lueying-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "缺少 $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lueying-$version-setup.exe" | Set-Content -Path "$setup.sha256" -Encoding ascii -NoNewline
          Get-Item $setup | Select-Object Name, Length
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $tag = $env:GITHUB_REF_NAME
          $setup = "dist/lueying-$version-setup.exe"
          $sha = "$setup.sha256"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sha --clobber
          } elseif ($version.Contains('-')) {
            # 预发布不能成为 releases/latest,否则稳定版用户会被升级到 beta。
            gh release create $tag $setup $sha --title "掠影 $version" --generate-notes --prerelease
          } else {
            gh release create $tag $setup $sha --title "掠影 $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 发布失败" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: lueying-windows
          path: |
            dist/lueying
            dist/lueying-*-setup.exe
            dist/lueying-*-setup.exe.sha256
