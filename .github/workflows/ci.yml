# push/PR 只做构建与静态检查;E2E 与准确率基准在 quality.yml,
# 每 30 分钟检查一次,同一提交成功跑过就跳过。
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式化 + 维护 Cargo.lock,有变化就回推(仅 push 到 main;GITHUB_TOKEN 推送不触发新 run)。
  # 锁文件必须入库:git 依赖(zed main)不锁则每次 run 解析新 rev,天然抖动。
  # 锁只在缺失或与清单失配时才重新生成(重新生成=把 zed 解析到当天 HEAD 并从此钉住);
  # 已有锁原样保留——rust-cache 的键含锁哈希,锁稳定缓存才不会每次全量重存挤爆配额。
  # 要跟进 zed main 时 `cargo update` 一次(本地或本 job 手动触发均可)。
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 判断本次提交是否动了清单需要父提交;浅克隆里 HEAD^ 不存在。
          fetch-depth: 2
      # 依赖解析要拉 zed 的 git 仓库,冷启动约 3 分钟。只有这次 push 动了清单/锁
      # 才需要重新解析;其余情况直接跳过,避免把 fmt 这个本该几秒的 job 拖成门禁。
      - name: 维护 Cargo.lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -Eq '(^|/)Cargo\.(toml|lock)$'; then
            echo "清单与锁未变化,跳过依赖解析"
            exit 0
          fi
          cargo metadata --locked --format-version 1 >/dev/null 2>&1 || cargo generate-lockfile
      - name: 格式化
        run: cargo fmt --all
      - name: 回推(如有变化)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "style: cargo fmt + Cargo.lock"
            (git pull --rebase && git push) || echo "推送被拒(并发提交撞车),下一轮 run 处理"
          fi
      - name: Format 校验
        run: cargo fmt --all --check

  engine:
    # 不等 fmt:格式化/lock 回推只影响下一轮,构建与测试没必要空等几分钟。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 按事件 SHA 检出,不与同一轮 fmt-bot 的回推抢 main;push 的 SHA 已包含上一轮的回推。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      # 版本比较/SHA 解析在 protocol crate,纯逻辑在 Linux 上测,
      # 不必为此在 Windows 上编译整棵 GPUI 依赖树。
      - name: Protocol 单元测试
        run: cargo test -p lueying-protocol --lib --locked

  windows:
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 35
    # 打 tag 时创建 Release;其他触发只读。
    permissions:
      contents: write
    steps:
      # 与 engine 一致按事件 SHA 检出;tag 构建检出的就是打 tag 的那个提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 缓存只留 windows job(gpui/zed 树是编译大头,ubuntu 两个 job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      # 安装冒烟与发版打包共用同一份 Inno 脚本;push/PR 不需要安装器。
      # 直接下载固定版本,避免 choco 包版本漂移。
      - name: 安装 Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败" }
          "LUEYING_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # ARM64 没有别的构建步骤;32 位 TSF 下面的 Build 32-bit TSF 已经覆盖。
      - name: ARM64 TSF 编译检查
        run: |
          rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc
          cargo check -p lueying-tsf --target aarch64-pc-windows-msvc --locked
      # Clippy 已在 Linux engine job 跑过;Windows 这份只观察、不阻断,纯属重复编译。
      - name: Build (release)
        id: build
        # 只编发版真正用到的包;E2E 宿主只在手动/tag 验证时再编。
        # 日常 E2E 已移到 quality.yml,每 30 分钟跑一次。
        run: cargo build --release --locked -p lueying-server -p lueying-tsf -p lueying-installer
      - name: Build E2E harness
        id: build_e2e
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked -p lueying-win-e2e -p lueying-install-e2e
      - name: Build 32-bit TSF
        run: cargo build --release -p lueying-tsf --target i686-pc-windows-msvc --locked
      - name: Stage 32-bit DLL for install E2E
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/lueying_tsf.dll target/release/lueying_tsf32.dll
      - name: Build 32-bit E2E host
        id: build32
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release -p lueying-win-e2e --target i686-pc-windows-msvc --locked
      - name: Windows 全链路 E2E
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build_e2e.outcome == 'success'
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 32 位 TSF 全链路 E2E
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build32.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "target/i686-pc-windows-msvc/release"
          Copy-Item target/release/lueying-server.exe $dir -Force
          # Server 是 64 位的,依赖的运行时 DLL 也要跟着过去;TSF DLL 保留 32 位。
          Get-ChildItem target/release -Filter *.dll -File |
            Where-Object { $_.Name -notlike "lueying_tsf*" } |
            Copy-Item -Destination $dir -Force
          New-Item -ItemType Directory -Force target/x86-e2e | Out-Null
          Push-Location target/x86-e2e
          & "..\i686-pc-windows-msvc\release\lueying-win-e2e.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: 安装/卸载冒烟
        # 构建失败时没有 lueying-user.exe,这条只会在日志里添一条假失败。
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.build.outcome == 'success' && steps.build_e2e.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      # Setup 在语言/提权问题下会在写 /LOG 前退出,默认日志落在 %TEMP%。
      # 失败时把两份都收进 artifact,否则只剩一个退出码。
      - name: 收集安装日志
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $dst = "target/install-e2e-logs"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dst -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory -Filter "lueying-install-e2e-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.log" -File -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.DirectoryName -Leaf
              Copy-Item $_.FullName (Join-Path $dst "$dir-$($_.Name)") -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: win-e2e-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/x86-e2e/target/win-e2e-report.md
            target/x86-e2e/target/win-e2e-tsf.log
            target/x86-e2e/target/win-e2e-server.log
            target/install-e2e-report.md
            # 安装冒烟卡死时没有报告,阶段跟踪是唯一线索。
            target/install-e2e-trace.log
            # 子进程输出走文件,超时/非零退出时看最后一段。
            target/install-e2e-logs/
      # 发布目录只在手动触发或打 tag 时生成:每次 push 打包会重复下载模型并传 artifact,
      # 早期迭代只需要构建与 E2E 信号。tag 构建同时上传 setup.exe/sha256 并创建 Release;
      # 代码签名仍未接,安装包目前是未签名构建。
      - name: 下载白霜词库(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_gram.sh data
      - name: 生成发布词典
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 读取发布版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须是 vX.Y.Z 或 vX.Y.Z-预发布: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version_args=()
          if [ -n "${VERSION:-}" ]; then version_args=(--version "$VERSION"); fi
          cargo run -p xtask --release --locked -- pack --bin target/release --bin32 target/i686-pc-windows-msvc/release --data data --out dist/lueying "${version_args[@]}"
      - name: 校验发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -f dist/lueying/LICENSE
          test -f dist/lueying/licenses/Apache-2.0.txt
          test -f dist/lueying/licenses/CC-BY-4.0.txt
          test -f dist/lueying/lueying-user.exe
          test -f dist/lueying/lueying-update.exe
          test -f dist/lueying/lueying_tsf.dll
          test -f dist/lueying/lueying_tsf32.dll
          test -f dist/lueying/main.gram
          ls dist/lueying-*-setup.exe >/dev/null
          if [ -n "${VERSION:-}" ]; then
            test "$(cat dist/lueying/version.txt)" = "$VERSION"
            test -f "dist/lueying-$VERSION-setup.exe"
          fi
          du -sh dist/lueying
          ls -lh dist/lueying-*-setup.exe
      - name: 生成安装包校验文件
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw "缺少 VERSION" }
          $setup = "dist/lueying-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "缺少 $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lueying-$version-setup.exe" | Set-Content -Path "$setup.sha256" -Encoding ascii -NoNewline
          Get-Item $setup | Select-Object Name, Length
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $tag = $env:GITHUB_REF_NAME
          $setup = "dist/lueying-$version-setup.exe"
          $sha = "$setup.sha256"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sha --clobber
          } elseif ($version.Contains('-')) {
            # 预发布不能成为 releases/latest,否则稳定版用户会被升级到 beta。
            gh release create $tag $setup $sha --title "掠影 $version" --generate-notes --prerelease
          } else {
            gh release create $tag $setup $sha --title "掠影 $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 发布失败" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: lueying-windows
          path: |
            dist/lueying
            dist/lueying-*-setup.exe
            dist/lueying-*-setup.exe.sha256
