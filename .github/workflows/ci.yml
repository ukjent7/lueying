name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_bench:
        description: 跑全量候选准确率基准(约 20 分钟)
        type: boolean
        default: false
  schedule:
    # 每天 UTC 18:00(北京时间 02:00)跑一次全量基准,避免每次 push 都等全语料。
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式化 + 维护 Cargo.lock,有变化就回推(仅 push 到 main;GITHUB_TOKEN 推送不触发新 run)。
  # 锁文件必须入库:git 依赖(zed main)不锁则每次 run 解析新 rev,天然抖动。
  # 锁只在缺失或与清单失配时才重新生成(重新生成=把 zed 解析到当天 HEAD 并从此钉住);
  # 已有锁原样保留——rust-cache 的键含锁哈希,锁稳定缓存才不会每次全量重存挤爆配额。
  # 要跟进 zed main 时 `cargo update` 一次(本地或本 job 手动触发均可)。
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 判断本次提交是否动了清单需要父提交;浅克隆里 HEAD^ 不存在。
          fetch-depth: 2
      # 依赖解析要拉 zed 的 git 仓库,冷启动约 3 分钟。只有这次 push 动了清单/锁
      # 才需要重新解析;其余情况直接跳过,避免把 fmt 这个本该几秒的 job 拖成门禁。
      - name: 维护 Cargo.lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -Eq '(^|/)Cargo\.(toml|lock)$'; then
            echo "清单与锁未变化,跳过依赖解析"
            exit 0
          fi
          cargo metadata --locked --format-version 1 >/dev/null 2>&1 || cargo generate-lockfile
      - name: 格式化
        run: cargo fmt --all
      - name: 回推(如有变化)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "style: cargo fmt + Cargo.lock"
            (git pull --rebase && git push) || echo "推送被拒(并发提交撞车),下一轮 run 处理"
          fi
      - name: Format 校验
        run: cargo fmt --all --check

  engine:
    # 不等 fmt:格式化/lock 回推只影响下一轮,构建与测试没必要空等几分钟。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 按事件 SHA 检出,不与同一轮 fmt-bot 的回推抢 main;push 的 SHA 已包含上一轮的回推。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      # 版本比较/SHA 解析在 protocol crate,纯逻辑在 Linux 上测,
      # 不必为此在 Windows 上编译整棵 GPUI 依赖树。
      - name: Protocol 单元测试
        run: cargo test -p lueying-protocol --lib --locked
      - name: 引擎 E2E(内置词库)
        run: cargo run -p lueying-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-mini
          path: target/e2e-report.md

  dict:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 与 engine 一致按事件 SHA 检出:同一轮 fmt-bot 回推不参与本次验证。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 词库/模型都由钉死 commit 的脚本生成,词典转换又是纯函数;按脚本与解析
      # 源码做键缓存 data/,大多数 push 可以直接跳过下载与 90 秒转换。
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_frost.sh', 'tools/fetch_gram.sh', 'tools/fetch_rerank.sh', 'xtask/src/**', 'crates/dict/src/**', 'Cargo.lock') }}
      - name: 下载白霜词库
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_gram.sh data
      - name: 转换词典
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      # push/PR 只跑确定性等距子集;全量语料放夜间与手动触发。
      - name: 主词典 E2E + 候选准确率基准(快速/夜间全量)
        shell: bash
        run: |
          mode=--bench-fast
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.full_bench }}" = "true" ]; then
            mode=--bench
          fi
          cargo run -p lueying-e2e --release --locked -- --dict data/main.tsv --gram data/main.gram --rerank-dir data/rerank "$mode"
      - name: 上传 E2E/基准报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dict-report
          path: |
            target/e2e-report.md
            target/bench-report.md
      # 90MB 词典只在夜间/手动/发版时留档:日常 push 看报告与缓存即可,
      # 每次都传会拖慢收尾并长期占满 artifact 配额。
      - name: 上传词典(夜间/手动/发版)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.full_bench == 'true' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dict-pipeline
          path: |
            data/main.tsv
            data/main.pyd
            data/main.gram
            target/e2e-report.md
            target/bench-report.md

  windows:
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 35
    # 打 tag 时创建 Release;其他触发只读。
    permissions:
      contents: write
    steps:
      # 与 engine 一致按事件 SHA 检出;tag 构建检出的就是打 tag 的那个提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 缓存只留 windows job(gpui/zed 树是编译大头,ubuntu 两个 job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      # ARM64 没有别的构建步骤;32 位 TSF 下面的 Build 32-bit TSF 已经覆盖。
      - name: ARM64 TSF 编译检查
        run: |
          rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc
          cargo check -p lueying-tsf --target aarch64-pc-windows-msvc --locked
      # Clippy 已在 Linux engine job 跑过;Windows 这份只观察、不阻断,纯属重复编译。
      - name: Build (release)
        id: build
        # 只编 Windows 验证与发版真正用到的包;e2e/xtask 等按需再编,
        # 避免每次 push 都为不参与 Windows 测试的二进制付链接时间。
        run: cargo build --release --locked -p lueying-server -p lueying-tsf -p lueying-installer -p lueying-win-e2e -p lueying-install-e2e
      - name: Build 32-bit TSF
        run: cargo build --release -p lueying-tsf --target i686-pc-windows-msvc --locked
      - name: Stage 32-bit DLL for install E2E
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/lueying_tsf.dll target/release/lueying_tsf32.dll
      - name: Build 32-bit E2E host
        id: build32
        run: cargo build --release -p lueying-win-e2e --target i686-pc-windows-msvc --locked
      - name: Windows 全链路 E2E
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 32 位 TSF 全链路 E2E
        if: always() && steps.build.outcome == 'success' && steps.build32.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "target/i686-pc-windows-msvc/release"
          Copy-Item target/release/lueying-server.exe $dir -Force
          New-Item -ItemType Directory -Force target/x86-e2e | Out-Null
          Push-Location target/x86-e2e
          & "..\i686-pc-windows-msvc\release\lueying-win-e2e.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: 安装/卸载冒烟
        # 构建失败时没有 lueying-install.exe,这条只会在日志里添一条假失败。
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-e2e-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/x86-e2e/target/win-e2e-report.md
            target/x86-e2e/target/win-e2e-tsf.log
            target/x86-e2e/target/win-e2e-server.log
            target/install-e2e-report.md
            # 安装冒烟卡死时没有报告,阶段跟踪是唯一线索。
            target/install-e2e-trace.log
      # 发布目录只在手动触发或打 tag 时生成:每次 push 打包会重复下载模型并传 artifact,
      # 早期迭代只需要构建与 E2E 信号。tag 构建同时上传 zip/sha256 并创建 Release;
      # 代码签名仍未接,更新包目前是未签名构建。
      - name: 下载白霜词库(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_gram.sh data
      - name: 生成发布词典
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 读取发布版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须是 vX.Y.Z 或 vX.Y.Z-预发布: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version_args=()
          if [ -n "${VERSION:-}" ]; then version_args=(--version "$VERSION"); fi
          cargo run -p xtask --release --locked -- pack --bin target/release --bin32 target/i686-pc-windows-msvc/release --data data --out dist/lueying "${version_args[@]}"
      - name: 校验发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -f dist/lueying/LICENSE
          test -f dist/lueying/licenses/Apache-2.0.txt
          test -f dist/lueying/licenses/CC-BY-4.0.txt
          test -f dist/lueying/lueying-update.exe
          ls dist/lueying/lueying_tsf-*.dll >/dev/null
          ls dist/lueying/lueying_tsf32-*.dll >/dev/null
          test -f dist/lueying/main.gram
          if [ -n "${VERSION:-}" ]; then
            test "$(cat dist/lueying/version.txt)" = "$VERSION"
          fi
          du -sh dist/lueying
      - name: 生成更新包与校验文件
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:VERSION
          if (-not $version) { throw "缺少 VERSION" }
          $name = "lueying-$version.zip"
          $zip = Join-Path "dist" $name
          Remove-Item $zip -ErrorAction SilentlyContinue
          tar.exe -a -cf $zip -C dist/lueying .
          if ($LASTEXITCODE -ne 0) { throw "zip 打包失败" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Path "$zip.sha256" -Encoding ascii -NoNewline
          $entries = tar.exe -tf $zip
          if (-not ($entries -match 'lueying-update\.exe$')) {
            throw "更新包缺少 lueying-update.exe"
          }
          Get-Item $zip | Select-Object Name, Length
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $tag = $env:GITHUB_REF_NAME
          $zip = "dist/lueying-$version.zip"
          $sha = "$zip.sha256"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber
          } elseif ($version.Contains('-')) {
            # 预发布不能成为 releases/latest,否则稳定版用户会被升级到 beta。
            gh release create $tag $zip $sha --title "掠影 $version" --generate-notes --prerelease
          } else {
            gh release create $tag $zip $sha --title "掠影 $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 发布失败" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: lueying-windows
          path: |
            dist/lueying
            dist/lueying-*.zip
            dist/lueying-*.zip.sha256
