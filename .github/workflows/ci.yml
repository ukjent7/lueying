name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式化 + 维护 Cargo.lock,有变化就回推(仅 push 到 main;GITHUB_TOKEN 推送不触发新 run)。
  # 锁文件必须入库:git 依赖(zed main)不锁则每次 run 解析新 rev,天然抖动。
  # 锁只在缺失或与清单失配时才重新生成(重新生成=把 zed 解析到当天 HEAD 并从此钉住);
  # 已有锁原样保留——rust-cache 的键含锁哈希,锁稳定缓存才不会每次全量重存挤爆配额。
  # 要跟进 zed main 时 `cargo update` 一次(本地或本 job 手动触发均可)。
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 维护 Cargo.lock
        run: cargo metadata --locked --format-version 1 >/dev/null 2>&1 || cargo generate-lockfile
      - name: 格式化
        run: cargo fmt --all
      - name: 回推(如有变化)
        if: github.event_name == 'push'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "style: cargo fmt + Cargo.lock"
            (git pull --rebase && git push) || echo "推送被拒(并发提交撞车),下一轮 run 处理"
          fi
      - name: Format 校验
        run: cargo fmt --all --check

  engine:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # push 到 main 时检出 fmt/lock 回推后的最新头(锁与代码同进,不靠事件重放);PR 检出合并引用
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      - name: 引擎 E2E(内置词库)
        run: cargo run -p pinyin-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-mini
          path: target/e2e-report.md

  dict:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      - name: 下载白霜词库
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载语法模型
        run: bash tools/fetch_gram.sh data/main.gram
      - name: 下载神经重排模型
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 转换词典
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 主词典 E2E + 候选准确率基准(模糊/语法/长期学习/重排)
        run: cargo run -p pinyin-e2e --release --locked -- --dict data/main.tsv --gram data/main.gram --rerank-dir data/rerank --bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dict-pipeline
          path: |
            data/main.tsv
            data/main.pyd
            target/e2e-report.md
            target/bench-report.md

  windows:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      # 缓存只留 windows job(gpui/zed 树是编译大头,ubuntu 两个 job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build (release)
        run: cargo build --release --workspace --locked
      - name: Windows 全链路 E2E(观察期,不阻断)
        continue-on-error: true
        run: cargo run -p pinyin-win-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-e2e-report
          path: target/win-e2e-report.md
