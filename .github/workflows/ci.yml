name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_bench:
        description: 跑全量候选准确率基准(约 20 分钟)
        type: boolean
        default: false
  schedule:
    # 每天 UTC 18:00(北京时间 02:00)跑一次全量基准,避免每次 push 都等全语料。
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 格式化 + 维护 Cargo.lock,有变化就回推(仅 push 到 main;GITHUB_TOKEN 推送不触发新 run)。
  # 锁文件必须入库:git 依赖(zed main)不锁则每次 run 解析新 rev,天然抖动。
  # 锁只在缺失或与清单失配时才重新生成(重新生成=把 zed 解析到当天 HEAD 并从此钉住);
  # 已有锁原样保留——rust-cache 的键含锁哈希,锁稳定缓存才不会每次全量重存挤爆配额。
  # 要跟进 zed main 时 `cargo update` 一次(本地或本 job 手动触发均可)。
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 维护 Cargo.lock
        run: cargo metadata --locked --format-version 1 >/dev/null 2>&1 || cargo generate-lockfile
      - name: 格式化
        run: cargo fmt --all
      - name: 回推(如有变化)
        if: github.event_name == 'push'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "style: cargo fmt + Cargo.lock"
            (git pull --rebase && git push) || echo "推送被拒(并发提交撞车),下一轮 run 处理"
          fi
      - name: Format 校验
        run: cargo fmt --all --check

  engine:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # push 到 main 时检出 fmt/lock 回推后的最新头(锁与代码同进,不靠事件重放);PR 检出合并引用
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 文档断链、裸 HTML 只有 rustdoc 会报;坏文档不会红编译,只能靠这条门禁
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked
      - name: 引擎 E2E(内置词库)
        run: cargo run -p lueying-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-mini
          path: target/e2e-report.md

  dict:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      - name: 下载白霜词库
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型
        run: bash tools/fetch_gram.sh data
      - name: 转换词典
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      # push/PR 只跑确定的等距子集(约 1 分钟);全量语料放夜间与手动触发。
      - name: 主词典 E2E + 候选准确率基准(快速/夜间全量)
        shell: bash
        run: |
          mode=--bench-fast
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.full_bench }}" = "true" ]; then
            mode=--bench
          fi
          cargo run -p lueying-e2e --release --locked -- --dict data/main.tsv --gram data/main.gram --rerank-dir data/rerank "$mode"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dict-pipeline
          path: |
            data/main.tsv
            data/main.pyd
            data/main.gram
            target/e2e-report.md
            target/bench-report.md

  windows:
    needs: fmt
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          persist-credentials: false
      # 缓存只留 windows job(gpui/zed 树是编译大头,ubuntu 两个 job 全量也只要几分钟);
      # PR 时 lookup-only 只恢复不保存,否则 PR 作用域会另存一份 1.5GB,挤爆 10GB 免费配额
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
      - name: 32 位 / ARM64 TSF 编译检查
        run: |
          rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc
          cargo check -p lueying-tsf --target i686-pc-windows-msvc --locked
          cargo check -p lueying-tsf --target aarch64-pc-windows-msvc --locked
      - name: Clippy(观察期,不阻断)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build (release)
        id: build
        run: cargo build --release --workspace --locked
      - name: Build 32-bit TSF
        run: cargo build --release -p lueying-tsf --target i686-pc-windows-msvc --locked
      - name: Stage 32-bit DLL for install E2E
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/lueying_tsf.dll target/release/lueying_tsf32.dll
      - name: Build 32-bit E2E host
        id: build32
        run: cargo build --release -p lueying-win-e2e --target i686-pc-windows-msvc --locked
      - name: Windows 全链路 E2E
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 32 位 TSF 全链路 E2E
        if: always() && steps.build.outcome == 'success' && steps.build32.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "target/i686-pc-windows-msvc/release"
          Copy-Item target/release/lueying-server.exe $dir -Force
          New-Item -ItemType Directory -Force target/x86-e2e | Out-Null
          Push-Location target/x86-e2e
          & "..\i686-pc-windows-msvc\release\lueying-win-e2e.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: 安装/卸载冒烟
        # 构建失败时没有 lueying-install.exe,这条只会在日志里添一条假失败。
        if: always() && steps.build.outcome == 'success'
        run: cargo run -p lueying-install-e2e --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-e2e-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/x86-e2e/target/win-e2e-report.md
            target/x86-e2e/target/win-e2e-tsf.log
            target/x86-e2e/target/win-e2e-server.log
            target/install-e2e-report.md
      # 发布目录只在手动触发或打 tag 时生成:每次 push 打包会重复下载模型并传 artifact,
      # 早期迭代只需要构建与 E2E 信号。这里不签名;签名与自动更新是后续发布工作。
      - name: 下载白霜词库(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型(发布包)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tools/fetch_gram.sh data
      - name: 生成发布词典
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      - name: 打包发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo run -p xtask --release --locked -- pack --bin target/release --bin32 target/i686-pc-windows-msvc/release --data data --out dist/lueying
      - name: 校验发布目录
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -f dist/lueying/LICENSE
          test -f dist/lueying/licenses/Apache-2.0.txt
          test -f dist/lueying/licenses/CC-BY-4.0.txt
          ls dist/lueying/lueying_tsf-*.dll >/dev/null
          ls dist/lueying/lueying_tsf32-*.dll >/dev/null
          test -f dist/lueying/main.gram
          du -sh dist/lueying
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: lueying-windows
          path: dist/lueying
