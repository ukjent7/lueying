name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 格式化并回推(如有差异)
        if: github.event_name == 'push'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "style: cargo fmt"
            git push
          fi
      - name: Format 校验
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 引擎 E2E(内置词库)
        run: cargo run -p pinyin-e2e --release
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report-mini
          path: target/e2e-report.md

  dict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 下载白霜词库
        run: bash tools/fetch_frost.sh data/frost
      - name: 转换词典
        run: cargo run -p xtask --release -- dict --frost data/frost --out data/main.tsv
      - name: 主词典 E2E(质量探针 + 性能阈值)
        run: cargo run -p pinyin-e2e --release -- --dict data/main.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: dict-pipeline
          path: |
            data/main.tsv
            target/e2e-report.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release --workspace
      - name: Windows 全链路 E2E(观察期,不阻断)
        continue-on-error: true
        run: cargo run -p pinyin-win-e2e --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-e2e-report
          path: target/win-e2e-report.md
