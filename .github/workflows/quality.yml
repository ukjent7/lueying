# 真实词典与引擎链路的门禁:Linux 场景 E2E、候选基准与学习模拟并行跑。
# Windows 全链路 E2E 与安装冒烟在 ci.yml 的 windows job 直跑,不再重复一套 Windows 构建。
# 核心路径改动在 push 到 main 时由 ci.yml 通过 workflow_call 调用;也可手动 workflow_dispatch,勾 full 跑全量候选基准。
# 同一提交成功跑过就跳过。
name: quality

on:
  workflow_dispatch:
    inputs:
      full:
        description: 跑全量候选基准(约 30 分钟)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 同一提交成功跑过就不重复跑全量基准;上次失败则同一提交会重跑。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 检查是否有新提交
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow quality.yml --status success --limit 1 \
            --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "同一提交已成功跑过,跳过"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # 场景 E2E 与候选准确率基准;OCR 真模型单测也在这里(与 ci.yml 共用 Linux 缓存)。
  linux-e2e:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
          # 与 ci.yml 的 Linux job 共用一份缓存:同一把锁、同一批依赖。
          prefix-key: linux
      # 与 ci.yml 共用同一份 data/ 缓存;下载脚本不变就不重下。
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_dict.sh', 'tools/fetch_ppocr.sh', 'tools/fetch_rerank.sh') }}
      - name: 下载词典与搭配表
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_dict.sh data
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载 PP-OCRv6 模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_ppocr.sh data/ppocr
      # 纯 Rust 推理在 Linux 上跑真模型,防止 det/rec 张量形状或后处理在
      # Windows 之外悄悄退化。
      - name: OCR 单测与 PP-OCRv6 真模型识别
        env:
          LUEYING_PPOCR_DIR: ${{ github.workspace }}/data/ppocr
        run: cargo test -p ppocr --release --locked -- --include-ignored
      - name: 安装 wasm-tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-tools
      - name: 构建官方 guest
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          wasm-tools component new target/wasm32-unknown-unknown/release/shot_ocr.wasm -o extensions/shot-ocr/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/clipboard_history.wasm -o extensions/clipboard-history/extension.wasm
          wasm-tools component new target/wasm32-unknown-unknown/release/voice_asr.wasm -o extensions/voice-asr/extension.wasm
      # 组件测试客人:场景 E2E 的扩展行为检查由它驱动。
      - name: 组件测试客人构建
        run: |
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-a.wasm
          CARGO_TARGET_DIR=target cargo build --release --manifest-path crates/ext/tests/fixture-guest/Cargo.toml --target wasm32-unknown-unknown --features variant-b
          wasm-tools component new target/wasm32-unknown-unknown/release/fixture_guest.wasm -o target/fixture-b.wasm
          echo "LUEYING_FIXTURE_WASM=$PWD/target/fixture-a.wasm" >> "$GITHUB_ENV"
          echo "LUEYING_FIXTURE_B_WASM=$PWD/target/fixture-b.wasm" >> "$GITHUB_ENV"
      - name: 主词典 E2E + 候选准确率基准
        run: cargo run -p lueying-bench --release --locked -- --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank ${{ inputs.full && '--bench' || '--bench-fast' }}
      - name: 报告摘要
        if: always()
        shell: bash
        run: |
          for f in target/e2e-report.md target/bench-report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: 上传 E2E/基准报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-linux-report
          path: |
            target/e2e-report.md
            target/bench-report.md
            target/e2e-failures.txt

  # 学习模拟与场景 E2E 并行:只吃引擎与词典,不需要 wasm 客人;
  # 单独一个 runner 拉平整条流水线。快速版每次都跑;完整版(含对验收集
  # 的副作用)只在手动勾选 full 时跑。用户语料只出汇总数字。
  linux-learn:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
          prefix-key: linux
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_dict.sh', 'tools/fetch_rerank.sh') }}
      - name: 下载词典与搭配表
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_dict.sh data
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 学习模拟
        run: cargo run -p lueying-bench --release --locked -- learn-sim --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank ${{ inputs.full && '--full' || '' }}
      - name: 报告摘要
        if: always()
        shell: bash
        run: |
          if [ -f target/learn-sim.md ]; then cat target/learn-sim.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 上传学习模拟报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-learn-report
          path: target/learn-sim.md
