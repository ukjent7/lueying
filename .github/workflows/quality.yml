# E2E 与候选准确率基准的常态化检查,从 push 门禁中剥离。
# 每 30 分钟看一次默认分支;同一提交成功跑过就跳过,避免空转。
# 需要立刻验证时手动 workflow_dispatch。
name: quality

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 没有新提交就不重复跑全量基准;上次失败则同一提交也会重跑。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 检查是否有新提交
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow quality.yml --status success --limit 1 \
            --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "同一提交已成功跑过,跳过"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 与 ci.yml 共用同一份 data/ 缓存;词典转换是纯函数,源码不变就不重转。
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_frost.sh', 'tools/fetch_gram.sh', 'tools/fetch_rerank.sh', 'xtask/src/**', 'xtask/data/**', 'crates/dict/src/**', 'Cargo.lock') }}
      - name: 下载白霜词库
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_frost.sh data/frost
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载精简语法模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_gram.sh data
      - name: 转换词典
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: cargo run -p xtask --release --locked -- dict --frost data/frost --out data/main.tsv --bin data/main.pyd
      # 全量语料 + 神经重排 + 长期学习,一次拿到完整报告。
      - name: 主词典 E2E + 全量候选准确率基准
        run: cargo run -p lueying-e2e --release --locked -- --dict data/main.tsv --gram data/main.gram --rerank-dir data/rerank --bench
      - name: 报告摘要
        if: always()
        shell: bash
        run: |
          for f in target/e2e-report.md target/bench-report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: 上传 E2E/基准报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-linux-report
          path: |
            target/e2e-report.md
            target/bench-report.md

  windows:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 定时跑不区分 PR,恢复并保存缓存;编译大头仍是 GPUI/zed 依赖树。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 安装冒烟每次都编译真实安装包,复用与发版相同的 Inno 脚本。
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败" }
          "LUEYING_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build (release)
        id: build
        run: cargo build --release --locked -p lueying-server -p lueying-tsf -p lueying-installer -p lueying-win-e2e -p lueying-install-e2e
      # 定时任务不经过 ci.yml 的 ARM64 检查,这里要自己补 i686 target。
      - name: 安装 i686 target
        run: rustup target add i686-pc-windows-msvc
      - name: Build 32-bit TSF
        id: build32tsf
        run: cargo build --release -p lueying-tsf --target i686-pc-windows-msvc --locked
      - name: Stage 32-bit DLL for install E2E
        id: stage32
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/lueying_tsf.dll target/release/lueying_tsf32.dll
      - name: Build 32-bit E2E host
        id: build32
        run: cargo build --release -p lueying-win-e2e --target i686-pc-windows-msvc --locked
      - name: Windows 全链路 E2E
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 32 位 TSF 全链路 E2E
        if: always() && steps.build.outcome == 'success' && steps.build32.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "target/i686-pc-windows-msvc/release"
          Copy-Item target/release/lueying-server.exe $dir -Force
          New-Item -ItemType Directory -Force target/x86-e2e | Out-Null
          Push-Location target/x86-e2e
          & "..\i686-pc-windows-msvc\release\lueying-win-e2e.exe"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: 安装/卸载冒烟
        if: always() && steps.build.outcome == 'success' && steps.build32tsf.outcome == 'success' && steps.stage32.outcome == 'success' && steps.build32.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      - name: 报告摘要
        if: always()
        shell: pwsh
        run: |
          $files = @("target/win-e2e-report.md", "target/x86-e2e/target/win-e2e-report.md", "target/install-e2e-report.md")
          foreach ($file in $files) {
            if (Test-Path $file) { Get-Content $file | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-windows-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/x86-e2e/target/win-e2e-report.md
            target/x86-e2e/target/win-e2e-tsf.log
            target/x86-e2e/target/win-e2e-server.log
            target/install-e2e-report.md
            target/install-e2e-trace.log
            target/install-e2e-logs/
