# 真实词典与安装链路的定时检查。每次 push/PR 的快速门禁在 ci.yml;
# 这里每小时看一次默认分支:场景、抽样候选基准、共享语料基准并行跑。
# 同一提交成功跑过就跳过;需要立刻验证时手动 workflow_dispatch,勾 full 跑全量候选基准。
name: quality

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: 跑全量候选基准(约 30 分钟)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 没有新提交就不重复跑全量基准;上次失败则同一提交也会重跑。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: 检查是否有新提交
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --workflow quality.yml --status success --limit 1 \
            --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "同一提交已成功跑过,跳过"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.event_name == 'pull_request' }}
          # 与 ci.yml 的 Linux job 共用一份缓存:同一把锁、同一批依赖。
          prefix-key: linux
      # 与 ci.yml 共用同一份 data/ 缓存;下载脚本不变就不重下。
      - name: 缓存词典与模型
        id: dict-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: dict-${{ hashFiles('tools/fetch_dict.sh', 'tools/fetch_ppocr.sh', 'tools/fetch_rerank.sh') }}
      - name: 下载词典与搭配表
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_dict.sh data
      - name: 下载神经重排模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_rerank.sh data/rerank
      - name: 下载 PP-OCRv6 模型
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_ppocr.sh data/ppocr
      # 纯 Rust 推理在 Linux 上跑真模型,防止 det/rec 张量形状或后处理在
      # Windows 之外悄悄退化。
      - name: OCR 单测与 PP-OCRv6 真模型识别
        env:
          LUEYING_PPOCR_DIR: ${{ github.workspace }}/data/ppocr
        run: cargo test -p ppocr --release --locked -- --include-ignored
      - name: 安装 wasm-tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-tools
      - name: 构建官方 guest
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          cp target/wasm32-unknown-unknown/release/shot_ocr.wasm extensions/shot-ocr/extension.wasm
          # 剪贴板已迁到组件 ABI:包成组件,宿主按魔数分流。
          wasm-tools component new target/wasm32-unknown-unknown/release/clipboard_history.wasm -o extensions/clipboard-history/extension.wasm
          cp target/wasm32-unknown-unknown/release/voice_asr.wasm extensions/voice-asr/extension.wasm
      - name: 主词典 E2E + 候选准确率基准
        run: cargo run -p lueying-e2e --release --locked -- --dict data/main.pyd --gram data/collocation.bin --rerank-dir data/rerank ${{ inputs.full && '--bench' || '--bench-fast' }}
      - name: 报告摘要
        if: always()
        shell: bash
        run: |
          for f in target/e2e-report.md target/bench-report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: 上传 E2E/基准报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-linux-report
          path: |
            target/e2e-report.md
            target/bench-report.md
            target/e2e-failures.txt

  # 共享语料基准单独铺开,不和上面的场景串行。
  shared:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    uses: ./.github/workflows/dict-bench.yml
    secrets: inherit

  windows:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 定时跑不区分 PR,恢复并保存缓存。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 官方 guest:win-e2e 装扩展与安装冒烟的发布包都要它;产物拷进仓库路径供运行期读取。
      - name: 构建官方 guest
        shell: pwsh
        run: |
          cargo build --release -p shot-ocr --target wasm32-unknown-unknown --locked
          cargo build --release -p clipboard-history --target wasm32-unknown-unknown --locked
          cargo build --release -p voice-asr --target wasm32-unknown-unknown --locked
          Copy-Item target/wasm32-unknown-unknown/release/shot_ocr.wasm extensions/shot-ocr/extension.wasm
          Copy-Item target/wasm32-unknown-unknown/release/clipboard_history.wasm extensions/clipboard-history/extension.wasm
          Copy-Item target/wasm32-unknown-unknown/release/voice_asr.wasm extensions/voice-asr/extension.wasm
      # 安装冒烟每次都编译真实安装包,复用与发版相同的 Inno 脚本。
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 安装失败" }
          "LUEYING_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build (release)
        id: build
        # TSF 不在这里:它要静态 CRT,单独一步构建(见 .cargo/config.toml)。
        # broker 也要:安装冒烟要把 lueying-broker.exe 打进安装包,它不是
        # installer 的依赖,不显式编就缺文件。
        run: cargo build --release --locked -p lueying-server -p lueying-broker -p lueying-net -p lueying-installer -p lueying-win-e2e -p lueying-install-e2e
      # TSF DLL(64 位):静态 CRT,独立 target 目录;产物拷回 target/release。
      - name: TSF 构建(静态 CRT)
        id: buildtsf
        env:
          CARGO_TARGET_DIR: target/tsf
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p lueying-tsf
          Copy-Item target/tsf/release/lueying_tsf.dll target/release/lueying_tsf.dll -Force
      - name: Windows 全链路 E2E
        run: cargo run -p lueying-win-e2e --release --locked
      - name: 安装/卸载冒烟
        if: always() && steps.build.outcome == 'success' && steps.buildtsf.outcome == 'success'
        timeout-minutes: 8
        run: cargo run -p lueying-install-e2e --release --locked
      # Setup 在语言/提权问题下会在写 /LOG 前退出,默认日志落在 %TEMP%。
      # 失败时把两份都收进 artifact,否则只剩一个退出码。
      - name: 收集安装日志
        if: always()
        shell: pwsh
        run: |
          $dst = "target/install-e2e-logs"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dst -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory -Filter "lueying-install-e2e-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Filter "*.log" -File -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.DirectoryName -Leaf
              Copy-Item $_.FullName (Join-Path $dst "$dir-$($_.Name)") -ErrorAction SilentlyContinue
            }
          }
      - name: 报告摘要
        if: always()
        shell: pwsh
        run: |
          $files = @("target/win-e2e-report.md", "target/install-e2e-report.md")
          foreach ($file in $files) {
            if (Test-Path $file) { Get-Content $file | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-windows-report
          path: |
            target/win-e2e-report.md
            target/win-e2e-tsf.log
            target/win-e2e-server.log
            target/install-e2e-report.md
            target/install-e2e-trace.log
            target/install-e2e-logs/
